/* ===== base (scaffolded) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { font-size: calc(106.25% * var(--scale)); scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

[hidden] { display: none !important; }

/* ===== controls ===== */

.ic.sm { width: 16px; height: 16px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }

.toast .undo { min-height: 32px; margin-left: var(--space-sm); color: var(--color-paper); text-decoration-color: var(--color-paper); }
.toast { display: flex; align-items: center; position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: var(--z-toast); transform: translateX(-50%); max-width: calc(100% - 32px); padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); }

/* ===== polish additions ===== */
.item { grid-template-columns: 28px 32px minmax(0, 1fr) auto; }

.badge.c-attraction, .badge.c-food, .badge.c-transport, .badge.c-activity, .badge.c-air, .badge.c-hotel { background: var(--cat); border-color: var(--cat); color: var(--color-card); }

.formerr { display: flex; gap: var(--space-xs); align-items: flex-start; color: var(--color-error); font-weight: 500; }
.input[aria-invalid="true"] { border-color: var(--color-error); }
.daystrip { -webkit-mask-image: linear-gradient(to right, black calc(100% - 48px), transparent); mask-image: linear-gradient(to right, black calc(100% - 48px), transparent); }
.nextup .t, .nextup .what b { color: var(--color-paper); }
.nextup .what span { color: var(--color-paper-3); }
.calc.empty .big { font-weight: 400; }
.setbtn[aria-current="page"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-accent); border-radius: 0; }
.syncbtn .syncshort { display: none; }

@media (max-width: 40rem) { .ledger { min-width: 0; } .item { grid-template-columns: 24px 32px minmax(0, 1fr); } .item-acts { grid-column: 3; } }

/* ===== panels: every section is its own bounded box ===== */
.box { background: var(--color-section); border: 1px solid var(--section-edge); border-radius: 14px; box-shadow: var(--section-shadow); padding: var(--space-lg); min-width: 0; }
.box > .sechead { margin: calc(var(--space-lg) * -1) calc(var(--space-lg) * -1) var(--space-md); padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--section-edge); align-items: center; }
.box > .sechead h2, .box > .sechead h3 { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-title); }
.box > .sechead .ic { color: var(--color-accent); }
.box .ruled { border-top: 0; }
.box .ruled > li:last-child { border-bottom: 0; }

.box .world { border: 0; border-radius: 8px; overflow: hidden; }
.box.set { border-top: 1px solid var(--section-edge); padding-top: var(--space-lg); }
.plan { gap: var(--space-lg); }

.daylist > li.ov-day.drop { background: var(--color-drop); border-color: var(--color-accent); }

@media (max-width: 40rem) { .ov-when { border-right: 0; padding-right: 0; } .box { padding: var(--space-md); } .box > .sechead { margin: calc(var(--space-md) * -1) calc(var(--space-md) * -1) var(--space-md); padding: var(--space-sm) var(--space-md); } }
.daynote { background: var(--color-section); border: 1px solid var(--section-edge); }
.mapcol.box { gap: var(--space-md); }
.mapcol .tripmap { border: 0; border-radius: 8px; }
.nextup { background: var(--nextup-bg); color: var(--nextup-fg); border: 1px solid var(--nextup-edge); }
:root[data-accent="lime"] .nextup { border: 2px solid var(--color-now); }
.daytab[aria-current="true"] b:is(:first-child) { color: var(--color-ink); }
.nextup .t, .nextup .what b { color: var(--nextup-fg); } .nextup .what span { color: var(--nextup-sub); }
.nextup .btn { border-color: var(--nextup-sub); color: var(--nextup-fg); }
@media (hover: hover) { .nextup .btn:hover:not(:disabled) { background: var(--nextup-fg); color: var(--nextup-bg); } }
.panel { border-radius: 14px; }
.todayband { border-radius: 14px; }
.input, .item-tools select { background: var(--color-paper); }

/* ===== merged plan rows ===== */
.item.timed { grid-template-columns: 3.5rem 28px 32px minmax(0, 1fr) auto; }
.pt { padding-top: var(--space-2xs); font-weight: 600; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.item.step .step-text { padding-top: var(--space-2xs); color: var(--color-ink-2); }
.ovrow .badge .ic { width: 15px; height: 15px; }
.planhint { margin-top: var(--space-sm); font-size: var(--text-sm); }
.dayedit .details { margin-bottom: var(--space-md); }
.dayedit .dayactions { margin-top: var(--space-md); }
.ovplan { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--section-edge); }
.ovrow { display: grid; grid-template-columns: 3.25rem 24px 30px minmax(0, 1fr); gap: var(--space-xs) var(--space-sm); align-items: start; padding-block: var(--space-sm); border-bottom: 1px solid var(--section-edge); transition: box-shadow var(--dur-short) var(--ease-out); }

.ovrow .handle { height: 30px; }

.ovtext b { display: inline-flex; align-items: center; gap: var(--space-xs); font-weight: 500; color: var(--color-ink); }

.ovkey { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
.keydot { width: 10px; height: 10px; border-radius: 50%; background: var(--cat); flex: 0 0 auto; }
.legend li { gap: var(--space-2xs); }
.keyb { width: 24px !important; height: 24px !important; margin-top: 0 !important; font-size: var(--text-xs); }
@media (max-width: 40rem) { .item.timed { grid-template-columns: 3rem 24px 32px minmax(0, 1fr); } .item.timed .item-acts { grid-column: 4; } .ovrow { grid-template-columns: 2.75rem 22px 28px minmax(0, 1fr); } }

.facts .cat-ic .ic, .item-name .cat-ic .ic, .ovtext .cat-ic .ic { color: var(--cat); }
.rates { display: flex; flex-direction: column; gap: var(--space-sm); margin: 0; padding: var(--space-md) 0 0; border: 0; border-top: 1px solid var(--section-edge); min-width: 0; }
.rates legend { padding: 0; font-weight: 600; color: var(--color-ink); }
.raterow { display: grid; grid-template-columns: max-content minmax(6rem, 10rem) minmax(0, 1fr); gap: var(--space-sm); align-items: center; }
.raterow label { color: var(--color-ink); font-variant-numeric: tabular-nums; }

.addtypes { flex-wrap: wrap; }
.addtypes button { display: inline-flex; align-items: center; gap: var(--space-2xs); }

/* ===== alignment pass: one row geometry, one control height ===== */
:root { --control-h: 44px; --row-time: 3.5rem; --row-handle: 28px; --row-badge: 32px; --row-gap: var(--space-sm); --row-lane: var(--control-h); }
/* plan rows and stay rows share one grid; every cell centres on the 44px control lane */
.item, .item.timed { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr) calc(var(--control-h) * 2 + 4px); column-gap: var(--row-gap); }
.item:not(.timed) > :first-child { grid-column: 2; }
.item > .pt { padding-top: calc((var(--row-lane) - 1lh) / 2); }
.item .handle { height: var(--row-lane); }
.item .badge { width: var(--row-badge); height: var(--row-badge); margin-top: calc((var(--row-lane) - var(--row-badge)) / 2); }
.item-name { flex-wrap: nowrap; align-items: flex-start; margin-top: calc((var(--row-lane) - 1lh) / 2); }
.item-acts { justify-content: flex-end; }
.item-name > .cat-ic, .ovtext b > .cat-ic, .facts li > .cat-ic { display: flex; align-items: center; height: 1lh; }
.ovtext b, .facts li { align-items: flex-start; }
/* details start where the name text starts, not under the icon */
.item-main:has(> .item-name > .cat-ic) > :is(.item-sub, .item-note, .nomap) { padding-left: 24px; }
.ovtext:has(> b > .cat-ic) > .ovnote { padding-left: 24px; }
/* overview rows use the same columns, on a 32px lane */
.ovrow { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr); column-gap: var(--row-gap); }
.ovrow .badge { width: var(--row-badge); height: var(--row-badge); margin-top: 0; }
.ovrow .handle { height: var(--row-badge); }
.ovrow .pt, .ovtext { padding-top: calc((var(--row-badge) - 1lh) / 2); }
.ov-move { margin-top: -6px; }
/* one control height */
input.input, select.input, .item-tools select { height: var(--control-h); padding-block: 0; }
.item-tools select { max-width: 100%; }
.seg button { min-height: 40px; }
/* editor panels */
.item-edit .seg { align-self: flex-start; background: var(--color-paper-3); }
.item-edit .item-tools { flex-direction: column; align-items: flex-start; gap: var(--space-2xs); margin-top: 0; }
.item-edit .item-tools label { color: var(--color-muted); font-size: var(--text-sm); }
/* edges */
.daytab:first-child { padding-left: 0; }
.bud-top > .panel { padding: var(--space-lg); }
/* hierarchy: the day leads on Itinerary, the trip name steps back */
.it-screen .titleinput { font-size: var(--text-2xl); }
.it-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }
.dayhead .daynote { margin-top: var(--space-sm); padding: 0; background: none; border: 0; max-width: 60ch; color: var(--color-ink-2); }
/* iPad portrait and phone: overview days stack, arrows sit beside the day label */
@media (max-width: 52rem) {
  .ov-day { grid-template-columns: minmax(0, 1fr) auto; }
  .ov-when { grid-column: 1; flex-direction: row; align-items: baseline; gap: var(--space-sm); padding-right: 0; border-right: 0; }
  .ov-move { grid-column: 2; grid-row: 1; flex-direction: row; margin-top: -10px; }
  .ov-body { grid-column: 1 / -1; }
}
@media (max-width: 40rem) {
  :root { --row-time: 2.75rem; --row-handle: 22px; --row-gap: var(--space-xs); }
  .item, .item.timed { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr); }
  .item .item-acts, .item.timed .item-acts { grid-column: 4; justify-content: flex-start; margin-left: -10px; }
  .item:has(.item-edit) > .item-main { grid-column: 1 / -1; }
}

/* ===== map column: wider, pinned beside the plan, as tall as the screen ===== */
.it-grid { grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: var(--space-xl); }
@media (min-width: 64.01rem) {
  .mapcol { position: sticky; top: calc(var(--bar-h) + var(--space-md)); height: calc(100dvh - var(--bar-h) - var(--space-xl)); max-height: 60rem; overflow: auto; }
  .mapcol > div:has(.tmapwrap) { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 20rem; }
  .mapcol .tmapwrap { position: relative; flex: 1 1 auto; min-height: 20rem; }
  .mapcol .tmapwrap .tripmap { position: absolute; inset: 0; aspect-ratio: auto !important; height: 100%; }
}
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }

/* ===== dark accents to compare: signal lime (default), bubblegum, signal lime, first light ===== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="pink"] { --color-accent: oklch(79% 0.15 350); --color-accent-strong: oklch(85% 0.12 350); --color-accent-ink: oklch(21% 0.05 350); --color-accent-wash: oklch(30% 0.075 350); --color-map-arc: oklch(79% 0.15 350 / 0.75); --cat-sight: oklch(73% 0.16 28); }
  :root:not([data-theme="light"])[data-accent="lime"] { --color-accent: oklch(85% 0.17 127); --color-accent-strong: oklch(90% 0.15 127); --color-accent-ink: oklch(22% 0.05 130); --color-accent-wash: oklch(24% 0.03 127); --color-map-arc: oklch(85% 0.17 127 / 0.7); --color-now: oklch(90% 0.2 126); --color-success: oklch(78% 0.1 185); --cat-food: oklch(80% 0.14 68); --cat-transport: oklch(76% 0.11 180); }

.lroute { stroke: var(--color-ink-2); fill: none; }
.leaflet-container { font: inherit; font-size: var(--text-xs); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--color-card); color: var(--color-ink); border-bottom-color: var(--color-rule); width: 34px; height: 34px; line-height: 34px; }

/* ===== city locations for the world map (free lookup, cached on this device) ===== */
function cityName(c){ return String(c || '').split(/\s+to\s+|\s*→\s*|\s*->\s*|\s*\/\s*/i)[0].trim(); }

async function lookupCity(name){
  try{

    const j = await r.json(); const f = j && j.features && j.features[0];
    if(!f) return { miss:true, at:Date.now() };
    return { lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], country:(f.properties && f.properties.country) || '', name:(f.properties && f.properties.name) || name };
  }catch(e){ return null; }

function cityGeo(name){
  const k = name.toLowerCase(); const c = library.cityCache[k];
  if(c && !c.miss) return c;

function cityPoint(name, t){

/* ===== world map, centred on Singapore (1 unit = 1 degree, Singapore at x 180) ===== */
const W = (lon, lat) => [((lon - HOME.lon + 540) % 360), 90 - lat];
function mapCities(){
  const out = new Map();

    const past = isPast(t);
    tripCities(t).forEach(name => {

      const k = name.toLowerCase(); const o = out.get(k) || { name, pt, past:false, trips:[] };

function worldMap(){

  Object.values(library.trips).forEach(t => {
    const first = tripCities(t)[0]; if(!first) return; const c = cityPoint(first, t); if(!c) return;
    const Pp = W(c.lon, c.lat);
    const mx = (H[0] + Pp[0]) / 2, my = (H[1] + Pp[1]) / 2, dx = Pp[0] - H[0], dy = Pp[1] - H[1], len = Math.hypot(dx, dy) || 1;
    if(len < 2) return;
    let px = -dy / len, py = dx / len; if(py > 0){ px = -px; py = -py; }
    s += `<path class="wm-arc ${isPast(t) ? '' : 'up'}" d="M${H[0]} ${H[1]} Q${(mx + px * len * .2).toFixed(2)} ${(my + py * len * .2).toFixed(2)} ${Pp[0].toFixed(2)} ${Pp[1].toFixed(2)}"/>`;
  });

    const [x, y] = W(c.pt.lon, c.pt.lat); const rr = S.hlCity === c.name ? r * 1.7 : r;
    s += `<circle class="${c.past ? 'wm-dot' : 'wm-ring'}" data-act="hl" data-c="${esc(c.name)}" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${rr}"><title>${esc(c.name)}${c.past ? '' : ', coming up'}</title></circle>`;
  });
  s += `<rect class="wm-home" x="${H[0] - r}" y="${H[1] - r}" width="${r * 2}" height="${r * 2}" transform="rotate(45 ${H[0]} ${H[1]})"><title>Singapore, home</title></rect></svg>`;
  const pos = (lon, lat) => { const [x, y] = W(lon, lat); return `left:${((x - vb[0]) / vb[2] * 100).toFixed(2)}%;top:${((y - vb[1]) / vb[3] * 100).toFixed(2)}%`; };

  // whichever side is free so labels never overlap. Sizes are in map units at desktop width.
  const groups = [];

    const g = groups.find(g => Math.hypot(g.xy[0] - o.xy[0], g.xy[1] - o.xy[1]) < 7);

  const rect = (x, y, side, w) => side === 'l' ? [x - GAP - w, y - LH / 2, x - GAP, y + LH / 2] : side === 'b' ? [x - w / 2, y + GAP, x + w / 2, y + GAP + LH] : side === 't' ? [x - w / 2, y - GAP - LH, x + w / 2, y - GAP] : [x + GAP, y - LH / 2, x + GAP + w, y + LH / 2];
  const hit = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
  const inMap = r => r[0] >= vb[0] && r[2] <= vb[0] + vb[2] && r[1] >= vb[1] && r[3] <= vb[1] + vb[3];
  const placed = [rect(H[0], H[1], 'b', 9 * CH)];
  cities.forEach(c => { const [x, y] = W(c.pt.lon, c.pt.lat); placed.push([x - r, y - r, x + r, y + r]); });
  const own = g => { const [x, y] = g.xy; return [x - r * 1.2, y - r * 1.2, x + r * 1.2, y + r * 1.2]; };

  groups.forEach(g => {
    const hl = g.names.includes(S.hlCity);
    const texts = hl ? [S.hlCity] : [g.names.slice(0, 2).join(', ') + (g.names.length > 2 ? ` +${g.names.length - 2}` : ''), g.names[0] + (g.names.length > 1 ? ` +${g.names.length - 1}` : '')];
    const at = hl ? cities.find(c => c.name === S.hlCity).pt : g.c.pt; const [x, y] = W(at.lon, at.lat);

      if(side || hl){ const sd = side || 'r'; placed.push(rect(x, y, sd, txt.length * CH)); labs += `<span class="wm-lab ${hl ? 'hl ' : ''}${sd === 'r' ? '' : sd}" style="${pos(at.lon, at.lat)}" aria-hidden="true">${esc(txt)}</span>`; break; }
    }

}

function splitPlaceText(q){

}
// "Chao Zhou Shi" → "chaozhou", so it matches the "Chaozhou" a search result gives.

async function findFromText(p){

  if(p.town) tries.push([`${p.name} ${stripTown(p.town)}`, '']);

  if(p.query && p.query !== p.name) tries.push([p.query, '']);

let linkSeq = 0;
async function resolveLink(){
  const seq = ++linkSeq; let r = parseMaps(S.link);

    if(!library.helperUrl){ S.linkRes = { kind:'nohelper' }; paintLink(); return; }
    S.linkRes = { kind:'loading' }; paintLink();
    try{
      const res = await fetch(library.helperUrl + (library.helperUrl.includes('?') ? '&' : '?') + 'u=' + encodeURIComponent(r.url));
      const j = await res.json(); if(seq !== linkSeq) return;

}

function syncMeta(id){ return sync.meta[id] || (sync.meta[id] = { sha:'', dirty:true }); }

async function syncNow(){

    // GitHub answers "not found" for a private repo the token can't see, so check the repo itself first.

function syncInfo(){

  if(sy.s === 'expiring') return `<div class="banner"><span>${tokenDaysLeft() < 0 ? 'Your GitHub token has expired.' : `Your GitHub token expires in ${tokenDaysLeft()} ${tokenDaysLeft() === 1 ? 'day' : 'days'}.`} Make a new one so sync keeps working.</span><button type="button" class="btn" data-act="dialog" data-d="token">Renew the token</button></div>`;

}

/* ===== Home ===== */
function scrHome(){
  const trips = Object.values(library.trips);

  const countries = new Set([...cities.values()].map(c => { const g = cityGeo(c); return g && g.country; }).filter(Boolean));
  const daysAway = past.reduce((a, t) => a + tripLen(t), 0);
  const next = trips.filter(isUpcoming).sort((a, b) => tripStart(a).localeCompare(tripStart(b)))[0];
  const now = findTodayTrip();
  const band = now
    ? `<section class="todayband" aria-label="Today"><div class="nt"><p>Day ${now.i + 1}${now.t.days[now.i].city ? ' in ' + esc(now.t.days[now.i].city) : ''}</p><span>${esc(tripLabel(now.t))}, ${dLong(now.t.days[now.i].date)}</span></div><button type="button" class="btn btn--primary" data-act="gotoday">Open today's plan</button></section>`
    : next ? `<section class="todayband" aria-label="Next trip"><div class="nt"><p>${esc(tripLabel(next))} starts ${startsIn(daysUntil(tripStart(next)))}</p><span>${dLong(tripStart(next))}${tripCities(next).length ? '. ' + tripCities(next).map(esc).join(', ') : ''}</span></div><button type="button" class="btn btn--primary" data-act="opentrip" data-id="${next.id}">Open trip</button></section>` : '';
  const sorted = trips.slice().sort((a, b) => (tripStart(b) || '9999').localeCompare(tripStart(a) || '9999'));
  const rows = sorted.map(t => {
    const st = tripStart(t), en = tripEnd(t);
    const live = now && now.t === t; const up = isUpcoming(t); const done = isPast(t);
    const status = live ? 'Travelling now' : up ? `Starts ${startsIn(daysUntil(st))}` : done ? (t.kind === 'maponly' ? 'Map-only' : `${I('check','sm')}Done`) : okDate(st) ? 'Travelling now' : 'Being planned';
    const len = tripLen(t);
    return `<tr><td><button type="button" class="row-open" data-act="opentrip" data-id="${t.id}">${esc(tripLabel(t))}</button></td><td class="num">${range(st, en)}${len ? `<br><span class="sub">${len} ${len === 1 ? 'day' : 'days'}</span>` : ''}</td><td>${tripCities(t).map(esc).join(', ') || '<span class="sub">No towns yet</span>'}</td><td><span class="status ${done ? 'done' : 'now'}">${status}</span></td>
      <td><button type="button" class="iconbtn" data-act="askdeltrip" data-id="${t.id}" aria-label="Delete ${esc(tripLabel(t))}">${I('x')}</button></td></tr>`;
  }).join('');
  return `<div class="screen">${syncBanner()}${band}
    <section class="worldfig box" aria-labelledby="h-world">
      <div class="home-head"><div><h1 id="h-world">Where you've been</h1></div>
        <ul class="legend" aria-label="Map key"><li><span class="key"></span>Visited</li><li><span class="key up"></span>Coming up</li><li><span class="key home"></span>Home</li></ul></div>

    </section>
    <section class="box" aria-labelledby="h-trips"><div class="sechead"><h2 id="h-trips">${I('plane')}Your trips</h2><div class="chips"><button type="button" class="btn" data-act="dialog" data-d="past">${I('plus','sm')}Add a past trip</button><button type="button" class="btn btn--primary" data-act="dialog" data-d="newtrip">${I('plus','sm')}New trip</button></div></div>
      ${trips.length ? `<div class="tablewrap"><table class="trips"><thead><tr><th scope="col">Trip</th><th scope="col">Dates</th><th scope="col">Cities</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Delete</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="sub" style="margin-top:var(--space-md)">Map-only trips just pin their cities. Open one to plan it day by day.</p>`
      : `<p class="empty">No trips yet. Start a new one, or add past trips so they show on the map. Moving from another device? Load a backup in <button type="button" class="link" data-act="nav" data-to="settings">Settings</button>.</p>`}
    </section></div>`;
}

/* ===== trip map (Leaflet with CARTO tiles: free, no Google map loads) ===== */
let MAP = null;
// Map tiles: OpenStreetMap is free with no key (dark mode darkens it with a filter). CARTO's nicer
// light and dark styles are used only when a CARTO key is saved, since without one they carry a watermark.
function tileLayer(dark){
  const k = (library.cartoApiKey || '').trim();
  if(k) return L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? 'dark_all' : 'rastertiles/voyager'}/{z}/{x}/{y}{r}.png?api_key=${encodeURIComponent(k)}`, { maxZoom:20, subdomains:'abcd', attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' });
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, className:'osm-tiles', attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' });
}
function mountMap(){
  const host = document.querySelector('.mapcol .tmapwrap'); if(!host) return;
  if(typeof L === 'undefined'){ host.innerHTML = '<p class="empty mapoff">The map could not load. Check the internet connection and open this day again.</p>'; return; }
  if(!MAP){
    const el = document.createElement('div'); el.className = 'lmap'; host.appendChild(el);
    const map = L.map(el, { zoomControl:true, worldCopyJump:true, tap:true });
    map.attributionControl.setPrefix(false);
    map.setView([HOME.lat, HOME.lon], 4);
    map.on('click', ev => { if(S.picking) dropPin(ev.latlng.lat, ev.latlng.lng); });
    MAP = { el, map, tiles:null, layer:L.layerGroup().addTo(map), sig:'', view:'', dark:null };
  } else host.appendChild(MAP.el);
  const dark = isDark();
  if(MAP.dark !== dark || MAP.tileKey !== library.cartoApiKey){
    if(MAP.tiles) MAP.map.removeLayer(MAP.tiles);
    MAP.tiles = tileLayer(dark).addTo(MAP.map);
    MAP.dark = dark; MAP.tileKey = library.cartoApiKey;
  }
  MAP.el.classList.toggle('picking', !!S.picking);
  MAP.map.invalidateSize({ pan:false });
  drawMarkers();
}
function drawMarkers(){
  const t = T(); const nums = numbering(t); const { filter, focus } = S.lastMap;
  const marks = []; const route = [];
  const add = (p, i, small) => {
    if(p.lat == null || p.type === 'flight') return;
    const hotel = p.type === 'hotel';
    marks.push({ id:p.id, lat:p.lat, lon:p.lon, hotel, cls: hotel ? 'hotel c-hotel' : 'c-' + p.category, txt: small ? '' : hotel ? 'H' : String(nums[p.id] || ''), small, label: (small ? `Day ${i + 1}, ` : '') + p.name });
  };
  if(filter === 'all'){
    const seenHotel = new Set();
    t.days.forEach((d, i) => d.places.forEach(p => { if(p.type === 'hotel'){ if(seenHotel.has(p.name)) return; seenHotel.add(p.name); } add(p, i, true); }));
  } else {
    const d = t.days[filter];
    if(d){ d.places.forEach(p => add(p, filter, false)); planOf(d).forEach(e => { if(e.kind === 'place' && e.p.lat != null) route.push([e.p.lat, e.p.lon]); }); }
  }
  const sig = JSON.stringify([marks, route, focus, S.mapPopup]);
  const viewSig = JSON.stringify([filter, focus, filter === 'all' ? t.id : (t.days[filter] || {}).id, marks.length]);
  if(sig !== MAP.sig){
    MAP.sig = sig; MAP.layer.clearLayers();
    if(route.length > 1) L.polyline(route, { className:'lroute', weight:2, dashArray:'5 6', interactive:false }).addTo(MAP.layer);
    marks.forEach(m => {
      const size = m.small ? 14 : 28;
      const icon = L.divIcon({ className:'lpin-wrap', html:`<span class="lpin ${m.cls} ${m.small ? 'small' : ''} ${focus === m.id || S.mapPopup === m.id ? 'focus' : ''}">${m.txt}</span>`, iconSize:[size, size], iconAnchor:[size / 2, size / 2] });
      L.marker([m.lat, m.lon], { icon, title:m.label, alt:m.label, keyboard:true, riseOnHover:true, zIndexOffset: m.hotel ? 0 : 100 })
        .on('click', () => { if(S.picking) return; S.mapPopup = m.id; render(); }).addTo(MAP.layer);
    });
  }
  if(viewSig !== MAP.view){
    MAP.view = viewSig;
    const f = focus && marks.find(m => m.id === focus);
    if(f) MAP.map.setView([f.lat, f.lon], 16);
    else if(marks.length === 1) MAP.map.setView([marks[0].lat, marks[0].lon], 14);
    else if(marks.length) MAP.map.fitBounds(L.latLngBounds(marks.map(m => [m.lat, m.lon])), { padding:[28, 28], maxZoom:15 });
    else {
      const d = filter === 'all' ? null : t.days[filter]; const g = d && cityName(d.city) ? cityGeo(cityName(d.city)) : null;
      const anyPin = []; t.days.forEach(dd => dd.places.forEach(p => { if(p.lat != null) anyPin.push([p.lat, p.lon]); }));
      if(g) MAP.map.setView([g.lat, g.lon], 12);
      else if(anyPin.length) MAP.map.fitBounds(L.latLngBounds(anyPin), { padding:[28, 28], maxZoom:13 });
      else MAP.map.setView([HOME.lat, HOME.lon], 3);
    }
  }
}
function dropPin(lat, lon){
  const f = findPlace(S.picking); S.picking = null; if(!f) return render();
  const t = T(); const same = t.days.flatMap(d => d.places).filter(p => p.type === 'hotel' && f.p.type === 'hotel' && p.name === f.p.name);
  (same.length ? same : [f.p]).forEach(p => { p.lat = +lat.toFixed(6); p.lon = +lon.toFixed(6); });
  S.mapPopup = f.p.id; announce(`Pinned ${f.p.name}`); changed(); render();
}
// Places from older versions may have no pin yet: look each one up once with the free search, like the old map did.
let geoBusy = false;
async function autoLocate(){
  const t = T(); if(geoBusy || !t || S.screen !== 'itinerary') return;
  const todo = []; t.days.forEach(d => d.places.forEach(p => { if(p.type !== 'flight' && p.lat == null && !(geoKey(p.name, d.city) in t.geocodeCache)) todo.push({ p, d }); }));
  if(!todo.length) return;
  geoBusy = true; let hit = false;
  for(const { p, d } of todo.slice(0, 12)){
    const c = await geocodePlace(p.name, cityName(d.city));
    t.geocodeCache[geoKey(p.name, d.city)] = c;
    if(c && p.lat == null){ p.lat = c.lat; p.lon = c.lon; hit = true; }
    await sleep(350);
  }
  geoBusy = false; saveSoon();
  if(hit){ changed(t); if(S.screen === 'itinerary' && !S.dialog && !document.activeElement.matches('input, textarea, select')) render(); }
}

function resetAdd(){ Object.assign(S, { addMode:'search', q:'', results:null, searching:false, picked:null, link:'', linkRes:null, addErr:null, addNote:'', wiki:null, sTime:'', sWhat:'', fName:'', fDep:'', fArr:'', addDay:null, hFrom:null, hTo:null }); }
function addPlace(noPin = false){
  const trip = T(); const t = S.addType; const di = S.addDay != null ? S.addDay : S.day; const day = trip.days[di];
  if(t === 'do' || t === 'move'){
    if(!S.sWhat.trim()){ S.addErr = t === 'do' ? 'Say what the activity is first.' : 'Add the route or details first.'; render(); return; }
    day.logistics.push({ time:S.sTime, desc:S.sWhat.trim(), kind: t === 'do' ? 'activity' : 'transport' });
    announce(`Added ${S.sWhat.trim()} to Day ${di + 1}`);
  } else if(t === 'flight'){
    if(!S.fName.trim()){ S.addErr = 'Enter the flight name or number first.'; render(); return; }
    day.places.unshift({ id:uid(), type:'flight', name:S.fName.trim(), departTime:S.fDep, arriveTime:S.fArr, note:S.addNote, lat:null, lon:null });
    announce(`Added ${S.fName.trim()} to Day ${di + 1}`);
  } else {
    let found = null;
    if(noPin){
      const name = S.addMode === 'search' ? S.q.trim() : ((S.linkRes && S.linkRes.name) || parseMaps(S.link).name || '').trim();

  if(e.key === 'Enter' && e.target.id === 'aq'){ e.preventDefault(); const first = document.querySelector('#ares .results button'); if(first && !S.picked) first.click(); return; }
  const h = e.target.closest && e.target.closest('.handle[data-drag]');
  if(!h || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const t = T(); const what = h.dataset.what || 'p', day = +h.dataset.day, idx = +h.dataset.idx, key = what === 's' ? 'logistics' : 'places';
  const arr = t.days[day][key]; let toDay = day, toIdx;
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    const step = e.key === 'ArrowUp' ? -1 : 1; let j = idx + step;
    while(j >= 0 && j < arr.length && what === 'p' && arr[j].type !== 'activity') j += step;
    if(j < 0 || j >= arr.length) return;
    toIdx = step < 0 ? j : j + 1;
  } else {
    toDay = day + (e.key === 'ArrowLeft' ? -1 : 1); if(toDay < 0 || toDay >= t.days.length) return; toIdx = null;
  }
  const finalIdx = toDay === day ? (toIdx > idx ? toIdx - 1 : toIdx) : t.days[toDay][key].length;
  moveItem(what, day, idx, toDay, toIdx);
  document.querySelector(`.handle[data-drag="${h.dataset.drag}"][data-what="${what}"][data-day="${toDay}"][data-idx="${finalIdx}"]`)?.focus();
});

/* ===== drag and drop (touch and mouse) ===== */
let drag = null;
function moveItem(what, fromDay, fromIdx, toDay, toIdx){
  const t = T(); const key = what === 's' ? 'logistics' : 'places';
  const src = t.days[fromDay][key]; const [x] = src.splice(fromIdx, 1); const dst = t.days[toDay][key];
  let at = toIdx == null ? dst.length : toIdx; if(fromDay === toDay && fromIdx < at) at -= 1;
  dst.splice(Math.max(0, Math.min(at, dst.length)), 0, x);
  const name = what === 's' ? (x.desc || 'the step') : x.name;
  changed(); announce(fromDay === toDay ? `Moved ${name}` : `Moved ${name} to Day ${toDay + 1}`);
  render();
}
function clearMarks(){ document.querySelectorAll('.drop,.before,.after').forEach(n => n.classList.remove('drop', 'before', 'after')); }
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if(!h) return;
  const kind = h.dataset.drag; const srcEl = kind === 'ov' ? h.closest('.ovrow') : h.closest('.item');
  drag = { kind, what:h.dataset.what || 'p', day:+h.dataset.day, idx:+h.dataset.idx, x:e.clientX, y:e.clientY, started:false, srcEl, ghost:null, target:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.started){ if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.started = true;
    const r = drag.srcEl.getBoundingClientRect(); const g = drag.srcEl.cloneNode(true); g.classList.add('dragghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; drag.srcEl.classList.add('src'); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  const edge = 80; if(e.clientY < edge) window.scrollBy(0, -14); else if(e.clientY > innerHeight - edge) window.scrollBy(0, 14);
  clearMarks(); drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = ''; drag.target = null;
  if(!under) return;
  const sel = drag.kind === 'ov' ? '.ovrow[data-row]' : '.item[data-drag-item]';
  const rowEl = under.closest(sel); const dayEl = drag.kind === 'ov' ? under.closest('.ov-day') : null;
  if(rowEl && rowEl !== drag.srcEl){
    const [what, dd, ii] = (rowEl.dataset.row || rowEl.dataset.dragItem).split(':'); const r = rowEl.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
    rowEl.classList.add(before ? 'before' : 'after');
    drag.target = what === drag.what ? { day:+dd, idx:+ii + (before ? 0 : 1) } : { day:+dd, idx:null };
  } else if(dayEl){ dayEl.classList.add('drop'); drag.target = { day:+dayEl.dataset.day, idx:null }; }
}, { passive:false });
document.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.started) return;
  d.ghost.remove(); clearMarks(); d.srcEl.classList.remove('src');
  if(d.target && !(d.target.day === d.day && (d.target.idx === d.idx || d.target.idx === d.idx + 1 || d.target.idx === null))) moveItem(d.what, d.day, d.idx, d.target.day, d.target.idx);
});
document.addEventListener('pointercancel', () => { if(drag){ drag.ghost?.remove(); clearMarks(); drag.srcEl.classList.remove('src'); drag = null; } });

/* ===== start ===== */
loadLibrary();
(() => {
  const hit = findTodayTrip();
  if(hit){ library.activeTripId = hit.t.id; S.screen = 'itinerary'; S.day = hit.i; }
  else S.screen = 'home';
})();
render();
saveNow();
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ saveNow(); if(sync.token && Object.values(sync.meta).some(m => m.dirty)) syncNow(); }
  else if(sync.token) syncNow();
});
window.addEventListener('online', () => { if(sync.token) syncNow(); });
window.addEventListener('offline', () => { if(sync.token){ S.syncState = 'offline'; paintSync(); } });
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { if(MAP && MAP.el.isConnected) MAP.map.invalidateSize({ pan:false }); }, 150); });
setInterval(() => { if(document.visibilityState === 'visible' && !S.dialog && !document.activeElement.matches('input, textarea, select')) paintSync(); }, 60000);
if(sync.token) setTimeout(syncNow, 600);
if('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
