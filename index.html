/* ===== base (scaffolded) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { font-size: calc(106.25% * var(--scale)); scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

[hidden] { display: none !important; }

/* ===== controls ===== */

.ic.sm { width: 16px; height: 16px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }

.toast .undo { min-height: 32px; margin-left: var(--space-sm); color: var(--color-paper); text-decoration-color: var(--color-paper); }
.toast { display: flex; align-items: center; position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: var(--z-toast); transform: translateX(-50%); max-width: calc(100% - 32px); padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); }

/* ===== polish additions ===== */
.item { grid-template-columns: 28px 32px minmax(0, 1fr) auto; }

.badge.c-attraction, .badge.c-food, .badge.c-transport, .badge.c-activity, .badge.c-air, .badge.c-hotel { background: var(--cat); border-color: var(--cat); color: var(--color-card); }

.formerr { display: flex; gap: var(--space-xs); align-items: flex-start; color: var(--color-error); font-weight: 500; }
.input[aria-invalid="true"] { border-color: var(--color-error); }
.daystrip { -webkit-mask-image: linear-gradient(to right, black calc(100% - 48px), transparent); mask-image: linear-gradient(to right, black calc(100% - 48px), transparent); }
.nextup .t, .nextup .what b { color: var(--color-paper); }
.nextup .what span { color: var(--color-paper-3); }
.calc.empty .big { font-weight: 400; }
.setbtn[aria-current="page"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-accent); border-radius: 0; }
.syncbtn .syncshort { display: none; }

@media (max-width: 40rem) { .ledger { min-width: 0; } .item { grid-template-columns: 24px 32px minmax(0, 1fr); } .item-acts { grid-column: 3; } }

/* ===== panels: every section is its own bounded box ===== */
.box { background: var(--color-section); border: 1px solid var(--section-edge); border-radius: 14px; box-shadow: var(--section-shadow); padding: var(--space-lg); min-width: 0; }
.box > .sechead { margin: calc(var(--space-lg) * -1) calc(var(--space-lg) * -1) var(--space-md); padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--section-edge); align-items: center; }
.box > .sechead h2, .box > .sechead h3 { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-title); }
.box > .sechead .ic { color: var(--color-accent); }
.box .ruled { border-top: 0; }
.box .ruled > li:last-child { border-bottom: 0; }

.box .world { border: 0; border-radius: 8px; overflow: hidden; }
.box.set { border-top: 1px solid var(--section-edge); padding-top: var(--space-lg); }
.plan { gap: var(--space-lg); }

.daylist > li.ov-day.drop { background: var(--color-drop); border-color: var(--color-accent); }

@media (max-width: 40rem) { .ov-when { border-right: 0; padding-right: 0; } .box { padding: var(--space-md); } .box > .sechead { margin: calc(var(--space-md) * -1) calc(var(--space-md) * -1) var(--space-md); padding: var(--space-sm) var(--space-md); } }
.daynote { background: var(--color-section); border: 1px solid var(--section-edge); }
.mapcol.box { gap: var(--space-md); }
.mapcol .tripmap { border: 0; border-radius: 8px; }
.nextup { background: var(--nextup-bg); color: var(--nextup-fg); border: 1px solid var(--nextup-edge); }
:root[data-accent="lime"] .nextup { border: 2px solid var(--color-now); }
.daytab[aria-current="true"] b:is(:first-child) { color: var(--color-ink); }
.nextup .t, .nextup .what b { color: var(--nextup-fg); } .nextup .what span { color: var(--nextup-sub); }
.nextup .btn { border-color: var(--nextup-sub); color: var(--nextup-fg); }
@media (hover: hover) { .nextup .btn:hover:not(:disabled) { background: var(--nextup-fg); color: var(--nextup-bg); } }
.panel { border-radius: 14px; }
.todayband { border-radius: 14px; }
.input, .item-tools select { background: var(--color-paper); }

/* ===== merged plan rows ===== */
.item.timed { grid-template-columns: 3.5rem 28px 32px minmax(0, 1fr) auto; }
.pt { padding-top: var(--space-2xs); font-weight: 600; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.item.step .step-text { padding-top: var(--space-2xs); color: var(--color-ink-2); }
.ovrow .badge .ic { width: 15px; height: 15px; }
.planhint { margin-top: var(--space-sm); font-size: var(--text-sm); }
.dayedit .details { margin-bottom: var(--space-md); }
.dayedit .dayactions { margin-top: var(--space-md); }
.ovplan { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--section-edge); }
.ovrow { display: grid; grid-template-columns: 3.25rem 24px 30px minmax(0, 1fr); gap: var(--space-xs) var(--space-sm); align-items: start; padding-block: var(--space-sm); border-bottom: 1px solid var(--section-edge); transition: box-shadow var(--dur-short) var(--ease-out); }

.ovrow .handle { height: 30px; }

.ovtext b { display: inline-flex; align-items: center; gap: var(--space-xs); font-weight: 500; color: var(--color-ink); }

.ovkey { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
.keydot { width: 10px; height: 10px; border-radius: 50%; background: var(--cat); flex: 0 0 auto; }
.legend li { gap: var(--space-2xs); }
.keyb { width: 24px !important; height: 24px !important; margin-top: 0 !important; font-size: var(--text-xs); }
@media (max-width: 40rem) { .item.timed { grid-template-columns: 3rem 24px 32px minmax(0, 1fr); } .item.timed .item-acts { grid-column: 4; } .ovrow { grid-template-columns: 2.75rem 22px 28px minmax(0, 1fr); } }

.facts .cat-ic .ic, .item-name .cat-ic .ic, .ovtext .cat-ic .ic { color: var(--cat); }
.rates { display: flex; flex-direction: column; gap: var(--space-sm); margin: 0; padding: var(--space-md) 0 0; border: 0; border-top: 1px solid var(--section-edge); min-width: 0; }
.rates legend { padding: 0; font-weight: 600; color: var(--color-ink); }
.raterow { display: grid; grid-template-columns: max-content minmax(6rem, 10rem) minmax(0, 1fr); gap: var(--space-sm); align-items: center; }
.raterow label { color: var(--color-ink); font-variant-numeric: tabular-nums; }

.addtypes { flex-wrap: wrap; }
.addtypes button { display: inline-flex; align-items: center; gap: var(--space-2xs); }

/* ===== alignment pass: one row geometry, one control height ===== */
:root { --control-h: 44px; --row-time: 3.5rem; --row-handle: 28px; --row-badge: 32px; --row-gap: var(--space-sm); --row-lane: var(--control-h); }
/* plan rows and stay rows share one grid; every cell centres on the 44px control lane */
.item, .item.timed { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr) calc(var(--control-h) * 2 + 4px); column-gap: var(--row-gap); }
.item:not(.timed) > :first-child { grid-column: 2; }
.item > .pt { padding-top: calc((var(--row-lane) - 1lh) / 2); }
.item .handle { height: var(--row-lane); }
.item .badge { width: var(--row-badge); height: var(--row-badge); margin-top: calc((var(--row-lane) - var(--row-badge)) / 2); }
.item-name { flex-wrap: nowrap; align-items: flex-start; margin-top: calc((var(--row-lane) - 1lh) / 2); }
.item-acts { justify-content: flex-end; }
.item-name > .cat-ic, .ovtext b > .cat-ic, .facts li > .cat-ic { display: flex; align-items: center; height: 1lh; }
.ovtext b, .facts li { align-items: flex-start; }
/* details start where the name text starts, not under the icon */
.item-main:has(> .item-name > .cat-ic) > :is(.item-sub, .item-note, .nomap) { padding-left: 24px; }
.ovtext:has(> b > .cat-ic) > .ovnote { padding-left: 24px; }
/* overview rows use the same columns, on a 32px lane */
.ovrow { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr); column-gap: var(--row-gap); }
.ovrow .badge { width: var(--row-badge); height: var(--row-badge); margin-top: 0; }
.ovrow .handle { height: var(--row-badge); }
.ovrow .pt, .ovtext { padding-top: calc((var(--row-badge) - 1lh) / 2); }
.ov-move { margin-top: -6px; }
/* one control height */
input.input, select.input, .item-tools select { height: var(--control-h); padding-block: 0; }
.item-tools select { max-width: 100%; }
.seg button { min-height: 40px; }
/* editor panels */
.item-edit .seg { align-self: flex-start; background: var(--color-paper-3); }
.item-edit .item-tools { flex-direction: column; align-items: flex-start; gap: var(--space-2xs); margin-top: 0; }
.item-edit .item-tools label { color: var(--color-muted); font-size: var(--text-sm); }
/* edges */
.daytab:first-child { padding-left: 0; }
.bud-top > .panel { padding: var(--space-lg); }
/* hierarchy: the day leads on Itinerary, the trip name steps back */
.it-screen .titleinput { font-size: var(--text-2xl); }
.it-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }
.dayhead .daynote { margin-top: var(--space-sm); padding: 0; background: none; border: 0; max-width: 60ch; color: var(--color-ink-2); }
/* iPad portrait and phone: overview days stack, arrows sit beside the day label */
@media (max-width: 52rem) {
  .ov-day { grid-template-columns: minmax(0, 1fr) auto; }
  .ov-when { grid-column: 1; flex-direction: row; align-items: baseline; gap: var(--space-sm); padding-right: 0; border-right: 0; }
  .ov-move { grid-column: 2; grid-row: 1; flex-direction: row; margin-top: -10px; }
  .ov-body { grid-column: 1 / -1; }
}
@media (max-width: 40rem) {
  :root { --row-time: 2.75rem; --row-handle: 22px; --row-gap: var(--space-xs); }
  .item, .item.timed { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr); }
  .item .item-acts, .item.timed .item-acts { grid-column: 4; justify-content: flex-start; margin-left: -10px; }
  .item:has(.item-edit) > .item-main { grid-column: 1 / -1; }
}

/* ===== map column: wider, pinned beside the plan, as tall as the screen ===== */
.it-grid { grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: var(--space-xl); }
@media (min-width: 64.01rem) {
  .mapcol { position: sticky; top: calc(var(--bar-h) + var(--space-md)); height: calc(100dvh - var(--bar-h) - var(--space-xl)); max-height: 60rem; overflow: auto; }
  .mapcol > div:has(.tmapwrap) { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 20rem; }
  .mapcol .tmapwrap { position: relative; flex: 1 1 auto; min-height: 20rem; }
  .mapcol .tmapwrap .tripmap { position: absolute; inset: 0; aspect-ratio: auto !important; height: 100%; }
}
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }

/* ===== dark accents to compare: signal lime (default), bubblegum, signal lime, first light ===== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="pink"] { --color-accent: oklch(79% 0.15 350); --color-accent-strong: oklch(85% 0.12 350); --color-accent-ink: oklch(21% 0.05 350); --color-accent-wash: oklch(30% 0.075 350); --color-map-arc: oklch(79% 0.15 350 / 0.75); --cat-sight: oklch(73% 0.16 28); }
  :root:not([data-theme="light"])[data-accent="lime"] { --color-accent: oklch(85% 0.17 127); --color-accent-strong: oklch(90% 0.15 127); --color-accent-ink: oklch(22% 0.05 130); --color-accent-wash: oklch(24% 0.03 127); --color-map-arc: oklch(85% 0.17 127 / 0.7); --color-now: oklch(90% 0.2 126); --color-success: oklch(78% 0.1 185); --cat-food: oklch(80% 0.14 68); --cat-transport: oklch(76% 0.11 180); }

   Data-shape changes go through migrateState() so old backups always load. */

// Google's free monthly allowance per call type. Place Details asks for basic fields only, which keeps

/* ===== small helpers ===== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const round2 = n => Math.round(n * 100) / 100;
function readJSON(k){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function geoKey(place, city){ return (String(place).trim() + '|' + String(city || '').trim()).toLowerCase(); }
function normalizeTimeForInput(str){
  if(!str) return '';
  str = String(str).trim();
  if(/^([01]\d|2[0-3]):[0-5]\d$/.test(str)) return str;
  const m = str.match(/^(\d{1,2})(?:[:.]([0-5]\d))?\s*([AaPp][Mm])?$/);
  if(!m) return '';
  let hour = parseInt(m[1], 10); const min = m[2] || '00'; const ap = m[3] ? m[3].toUpperCase() : null;
  if(ap === 'PM' && hour < 12) hour += 12;
  if(ap === 'AM' && hour === 12) hour = 0;
  if(hour < 0 || hour > 23) return '';
  return String(hour).padStart(2, '0') + ':' + min;
}

/* ===== library ===== */
let library = null;
function defaultTrip(){
  const now = new Date().toISOString();
  return { id:uid(), createdAt:now, updatedAt:now, tripName:'', kind:'full', currency:'SGD', baseCurrency:'SGD', rates:{}, budgetTarget:null, start:'', end:'', cities:[], days:[], expenses:[], geocodeCache:{} };
}
function newDay(date = ''){ return { id:uid(), date, city:'', notes:'', logistics:[], places:[] }; }

// Brings any saved trip, from any version of this app, up to the current shape. Only adds or tidies
// fields, never drops data, so old backups keep loading.
function migrateState(t){
  if(!t || typeof t !== 'object') return t;
  if(!t.id) t.id = uid();
  if(!t.createdAt) t.createdAt = new Date().toISOString();
  if(!t.updatedAt) t.updatedAt = t.createdAt;
  if(typeof t.tripName !== 'string') t.tripName = String(t.tripName || '');
  if(!t.currency) t.currency = 'SGD';
  if(!t.baseCurrency) t.baseCurrency = 'SGD';
  if(!t.rates || typeof t.rates !== 'object' || Array.isArray(t.rates)) t.rates = {};
  if(t.kind !== 'maponly') t.kind = 'full';
  if(!Array.isArray(t.cities)) t.cities = [];
  if(typeof t.start !== 'string') t.start = '';
  if(typeof t.end !== 'string') t.end = '';
  if(!Array.isArray(t.days)) t.days = [];
  if(!Array.isArray(t.expenses)) t.expenses = [];
  if(!t.geocodeCache || typeof t.geocodeCache !== 'object') t.geocodeCache = {};
  t.days.forEach(d => {
    if(!d.id) d.id = uid();
    if(typeof d.date !== 'string') d.date = '';
    if(typeof d.city !== 'string') d.city = String(d.city || '');
    if(typeof d.notes !== 'string') d.notes = String(d.notes || '');
    if(!Array.isArray(d.places)){
      d.places = [];
      if(d.hotel) d.places.push({ id:uid(), type:'hotel', name:d.hotel, lat:null, lon:null });
      if(Array.isArray(d.activities)) d.activities.forEach(a => d.places.push({ id:uid(), type:'activity', name:a, lat:null, lon:null }));
      delete d.hotel; delete d.activities;
    }
    if(!Array.isArray(d.logistics)) d.logistics = [];
    d.logistics.forEach(l => {
      l.time = normalizeTimeForInput(l.time);
      if(typeof l.desc !== 'string') l.desc = String(l.desc || '');
      if(l.kind !== 'activity') l.kind = 'transport';
    });
    d.places.forEach(p => {
      if(!p.id) p.id = uid();
      if(!['hotel','flight','activity'].includes(p.type)) p.type = 'activity';
      if(p.type === 'activity' && p.category !== 'food') p.category = 'attraction';
      if(typeof p.name !== 'string') p.name = String(p.name || '');
      if(typeof p.note !== 'string') p.note = String(p.note || '');
      if(typeof p.lat !== 'number' || typeof p.lon !== 'number'){
        p.lat = null; p.lon = null;
        const c = t.geocodeCache[geoKey(p.name, d.city)];
        if(c && typeof c.lat === 'number'){ p.lat = c.lat; p.lon = c.lon; }
      }
      if(p.type === 'activity') p.time = normalizeTimeForInput(p.time);
      if(p.type === 'flight'){ p.departTime = normalizeTimeForInput(p.departTime); p.arriveTime = normalizeTimeForInput(p.arriveTime); }
    });
  });
  // Blank rows from the old app's "+ Add expense" carry nothing: no description, amount or date.
  t.expenses = t.expenses.filter(e => e && (e.desc || Number(e.amount) || e.date || e.unit));
  t.expenses.forEach(e => {
    if(!e.id) e.id = uid();
    if(CATEGORY_RENAME_MAP[e.category]) e.category = CATEGORY_RENAME_MAP[e.category];
    if(!CATS.some(c => c.k === e.category)) e.category = 'Misc';
    if(!e.currency) e.currency = t.currency || 'SGD';
    if(typeof e.desc !== 'string') e.desc = String(e.desc || '');
    if(typeof e.date !== 'string') e.date = '';
    if(e.unit != null && e.qty != null) e.amount = round2(Number(e.unit) * Number(e.qty));
    e.amount = Number(e.amount) || 0;
  });
  return t;
}
function loadLibrary(){
  let lib = readJSON(LS_KEY);
  if(!lib){
    const old = readJSON(LS_LEGACY);
    if(old && Array.isArray(old.days)){ const t = Object.assign(defaultTrip(), old, { id:uid() }); lib = { activeTripId:t.id, trips:{ [t.id]:t } }; }
  }
  if(!lib || typeof lib !== 'object') lib = {};
  if(!lib.trips || typeof lib.trips !== 'object') lib.trips = {};
  ['googleApiKey','cartoApiKey','helperUrl'].forEach(k => { if(typeof lib[k] !== 'string') lib[k] = ''; });
  if(!lib.cityCache || typeof lib.cityCache !== 'object') lib.cityCache = {};
  if(!lib.usage || typeof lib.usage !== 'object') lib.usage = {};
  if(lib.apiUsage && lib.apiUsage.month){ lib.usage[dev.id] = Object.assign({}, lib.apiUsage); delete lib.apiUsage; }
  Object.values(lib.trips).forEach(migrateState);
  // An empty, unnamed trip is what older versions created on first open. It isn't a real trip.
  Object.values(lib.trips).forEach(t => { if(!t.tripName && !t.days.length && !t.expenses.length && Object.keys(lib.trips).length > 1) delete lib.trips[t.id]; });
  if(!lib.trips[lib.activeTripId]) lib.activeTripId = Object.keys(lib.trips)[0] || null;
  library = lib;
}
const T = () => (library.activeTripId && library.trips[library.activeTripId]) || null;

/* ===== saving ===== */
let saveTimer = null;

}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }

/* ===== money ===== */
function fmt(cur, n){ if(!isFinite(n)) return 'No rate yet'; const dec = ZERO_DEC.has(cur) ? 0 : 2; return (SYM[cur] || cur + ' ') + Number(n).toLocaleString('en-SG', { minimumFractionDigits:dec, maximumFractionDigits:dec }); }
const rateOf = (t, cur) => cur === t.baseCurrency ? 1 : t.rates[cur];
const conv = (t, from, to, n) => { const a = rateOf(t, from), b = rateOf(t, to); return a && b ? n / a * b : NaN; };
const fmtRate = n => Number(n).toLocaleString('en-SG', { maximumFractionDigits:4 });
function tripCurs(t){ const s = new Set([t.currency]); t.expenses.forEach(e => s.add(e.currency)); s.delete(t.baseCurrency); return [...s]; }
function rateLine(t){ const l = tripCurs(t).filter(c => t.rates[c]).map(c => `1 ${t.baseCurrency} = ${fmtRate(t.rates[c])} ${c}`); return l.length ? `Rate: ${l.join(', ')}` : (tripCurs(t).length ? 'No exchange rate set yet' : ''); }
function changeBase(t, N){
  const r = t.rates, B = t.baseCurrency; if(N === B) return;
  const k = r[N]; const nr = {};
  if(k){ Object.entries(r).forEach(([c, v]) => { if(c !== N) nr[c] = v / k; }); nr[B] = 1 / k; }
  t.rates = nr; t.baseCurrency = N;
}
const expTotal = e => Number(e.amount) || 0;
function breakdown(e){
  const m = catOf(e.category).mode;
  if(m === 'pax' && e.unit != null && e.qty) return `${e.qty} ${e.qty == 1 ? 'person' : 'people'} × ${fmt(e.currency, e.unit)}`;
  if(m === 'nights' && e.nights) return `${e.nights} ${e.nights == 1 ? 'night' : 'nights'} at ${fmt(e.currency, expTotal(e) / e.nights)}`;
  return '';
}
function totals(t){
  const by = {}; let all = 0; const missing = new Set(); let left = 0;
  t.expenses.forEach(e => { const v = conv(t, e.currency, t.baseCurrency, expTotal(e)); if(!isFinite(v)){ missing.add(e.currency); left++; return; } by[e.category] = (by[e.category] || 0) + v; all += v; });
  return { by, all, missing:[...missing], left };
}

/* ===== dates ===== */
// ?today=2026-11-21T10:15 pretends it is that moment, for checking the during-trip screens.
const TODAY_OVERRIDE = (() => { try{ const v = new URLSearchParams(location.search).get('today'); const d = v ? new Date(v) : null; return d && !isNaN(d) ? d : null; }catch(e){ return null; } })();
const today = () => TODAY_OVERRIDE ? new Date(TODAY_OVERRIDE) : new Date();
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const okDate = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || '');
const dLong = iso => okDate(iso) ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) : 'No date set';
const dMid = iso => okDate(iso) ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) : 'No date';
const dShort = iso => okDate(iso) ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : 'No date';
const year = iso => iso.slice(0, 4);
const daysUntil = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(today().toDateString())) / 864e5);
function addDaysISO(iso, n){ const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }
function range(a, b){ if(!okDate(a)) return 'Dates not set'; if(!okDate(b) || a === b) return `${dShort(a)} ${year(a)}`; return year(a) === year(b) ? `${dShort(a)} to ${dShort(b)} ${year(b)}` : `${dShort(a)} ${year(a)} to ${dShort(b)} ${year(b)}`; }
function tripStart(t){ if(t.kind === 'maponly') return t.start; const ds = t.days.map(d => d.date).filter(okDate).sort(); return ds[0] || ''; }
function tripEnd(t){ if(t.kind === 'maponly') return t.end || t.start; const ds = t.days.map(d => d.date).filter(okDate).sort(); return ds[ds.length - 1] || ''; }
function tripLen(t){ const a = tripStart(t), b = tripEnd(t); return okDate(a) && okDate(b) ? Math.round((new Date(b) - new Date(a)) / 864e5) + 1 : (t.kind === 'full' ? t.days.length : 0); }
const isPast = t => okDate(tripEnd(t)) && new Date(tripEnd(t) + 'T23:59:59') < today();
const isUpcoming = t => okDate(tripStart(t)) && daysUntil(tripStart(t)) > 0;
const tripDayIndex = (t = T()) => t ? t.days.findIndex(d => d.date === isoLocal(today())) : -1;
function findTodayTrip(){ for(const t of Object.values(library.trips)){ if(t.kind !== 'full') continue; const i = tripDayIndex(t); if(i > -1) return { t, i }; } return null; }

/* ===== plan for a day ===== */
const STEPIC = { activity:'flag', transport:'train' };
function flightTime(p){ const a = p.arriveTime, d = p.departTime; return a && d && a < d ? a : (d || a || ''); }
function planOf(d){
  const places = d.places.map((p, pi) => ({ kind:'place', p, pi, t:p.time || '' })).filter(x => x.p.type === 'activity');
  const extra = d.logistics.map((s, k) => ({ kind:'step', sk:s.kind || 'transport', t:s.time || '', d:s.desc || '', k }))
    .concat(d.places.map((p, pi) => ({ p, pi })).filter(x => x.p.type === 'flight').map(x => ({ kind:'flight', p:x.p, pi:x.pi, t:flightTime(x.p) })));
  const timed = places.filter(x => x.t).concat(extra.filter(x => x.t)).sort((a, b) => a.t.localeCompare(b.t) || (a.kind === 'place' ? 1 : -1));
  const untimed = places.filter(x => !x.t).concat(extra.filter(x => !x.t));
  // Numbers run through the whole trip: Day 2 carries on from where Day 1 stopped.
  const t = T(); let n = 0;
  if(t && t.days.includes(d)) for(const x of t.days){ if(x === d) break; n += x.places.filter(p => p.type === 'activity' || p.type === 'flight').length + x.logistics.length; }
  timed.concat(untimed).forEach(e => { e.n = ++n; });
  return untimed.length && timed.length ? timed.concat([{ kind:'divider' }], untimed) : timed.concat(untimed);
}
function numbering(t){ const m = {}; t.days.forEach(d => planOf(d).forEach(e => { if(e.kind === 'place') m[e.p.id] = e.n; })); return m; }
function hotelDays(t, name){ return t.days.map((d, i) => d.places.some(p => p.type === 'hotel' && p.name === name) ? i + 1 : null).filter(Boolean); }
function stayText(t, name){
  const ds = hotelDays(t, name); const n = ds.length; if(!n) return '';
  const a = t.days[ds[0] - 1].date, l = t.days[ds[n - 1] - 1].date;
  return `${n} ${n === 1 ? 'night' : 'nights'}` + (okDate(a) && okDate(l) ? `, ${dShort(a)} to ${dShort(addDaysISO(l, 1))}` : '');
}
function dayList(nums){ return nums.length > 2 && nums[nums.length - 1] - nums[0] === nums.length - 1 ? `Days ${nums[0]} to ${nums[nums.length - 1]}` : (nums.length > 1 ? 'Days ' : 'Day ') + nums.join(' and '); }
const placeIcon = p => p.type === 'flight' ? 'plane' : p.type === 'hotel' ? 'bed' : p.category === 'food' ? 'bowl' : 'pin';
function findPlace(id, t = T()){ if(!t) return null; for(const d of t.days){ const i = d.places.findIndex(p => p.id === id); if(i > -1) return { d, i, p:d.places[i] }; } return null; }
const dayLabel = (d, j) => `Day ${j + 1}${okDate(d.date) ? ', ' + dShort(d.date) : ''}${d.city ? ', ' + d.city : ''}`;

/* ===== Google Places (needs the key in Settings) and free search fallbacks ===== */
const gkey = () => (library.googleApiKey || '').trim();
function trackApiCall(kind){
  const mk = isoLocal(today()).slice(0, 7);
  let u = library.usage[dev.id];
  if(!u || u.month !== mk) u = library.usage[dev.id] = { month:mk };
  u[kind] = (u[kind] || 0) + 1;
  saveSoon(); // counts go up with the next sync; they never mark the keys as changed
}
function usageTotal(kind){ const mk = isoLocal(today()).slice(0, 7); return Object.values(library.usage).reduce((a, u) => a + (u && u.month === mk ? (u[kind] || 0) : 0), 0); }
let googleSessionToken = null, googleMapsLoadingPromise = null;

async function searchPlacesGoogle(query, cityHint){

    if(!googleSessionToken) googleSessionToken = new AutocompleteSessionToken();
    const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: cityHint ? `${query}, ${cityHint}` : query, sessionToken: googleSessionToken });
    trackApiCall('autocomplete');

async function searchPlaces(query, cityHint){

      const p = f.properties || {}; const c = f.geometry && f.geometry.coordinates; if(!c) return null;

    const hit = s && s.query && s.query.search && s.query.search[0]; if(!hit) return null;

/* ===== city locations for the world map (free lookup, cached on this device) ===== */
function cityName(c){ return String(c || '').split(/\s+to\s+|\s*→\s*|\s*->\s*|\s*\/\s*/i)[0].trim(); }
function tripCities(t){ if(t.kind === 'maponly') return t.cities.filter(Boolean); const s = []; t.days.forEach(d => { const c = cityName(d.city); if(c && !s.some(x => x.toLowerCase() === c.toLowerCase())) s.push(c); }); return s; }
const cityQueue = new Set(); let cityBusy = false;
async function lookupCity(name){
  try{
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(name)}&limit=1&lang=en&osm_tag=place`);
    const j = await r.json(); const f = j && j.features && j.features[0];
    if(!f) return { miss:true, at:Date.now() };
    const pr = f.properties || {};
    return { lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], country:pr.country || '', cc:(pr.countrycode || '').toUpperCase(), state:pr.state || '', name:pr.name || name };
  }catch(e){ return null; }
}
function cityGeo(name){
  const k = name.toLowerCase(); const c = library.cityCache[k];
  if(c && !c.miss){ if(c.cc === undefined && !cityQueue.has(k)){ c.cc = ''; cityQueue.add(k); pumpCities(); } return c; } // older entries: look again for the country code
  if(c && c.miss && Date.now() - c.at < 7 * 864e5) return null;
  if(!cityQueue.has(k)){ cityQueue.add(k); pumpCities(); }
  return null;
}
async function pumpCities(){
  if(cityBusy) return; cityBusy = true; let got = false;
  while(cityQueue.size){
    const k = cityQueue.values().next().value;
    const r = await lookupCity(k);
    cityQueue.delete(k);
    if(r){ library.cityCache[k] = r; got = true; }
    await sleep(300);
  }
  cityBusy = false;
  if(!got) return;
  saveSoon();
  const pc = document.getElementById('pcheck');
  if(pc) pc.innerHTML = pastCheckHTML(S.pastForm.cities.split(',').map(s => s.trim()).filter(Boolean));
  else if(S.screen === 'home' && !S.dialog){ footCache.clear(); render(); }
}
// Where a city sits: the looked-up point, or failing that the middle of the trip's pinned places there.
function cityPoint(name, t){
  const g = cityGeo(name); if(g) return g;
  if(!t || t.kind !== 'full') return null;
  const ps = []; t.days.forEach(d => { if(cityName(d.city).toLowerCase() === name.toLowerCase()) d.places.forEach(p => { if(p.lat != null) ps.push(p); }); });
  if(!ps.length) return null;
  return { lat: ps.reduce((a, p) => a + p.lat, 0) / ps.length, lon: ps.reduce((a, p) => a + p.lon, 0) / ps.length, country:'' };
}

/* ===== what has been travelled so far ===== */
// Days and cities count once they have happened: past trips in full, and the trip you're on up to today.
function travelled(t){
  const td = isoLocal(today());
  if(t.kind === 'maponly'){
    const a = t.start, b = okDate(t.end) ? t.end : t.start;
    if(!okDate(a) || a > td) return { days:0, cities:[] };
    const end = b < td ? b : td;
    return { days:Math.round((new Date(end) - new Date(a)) / 864e5) + 1, cities:t.cities.filter(Boolean) };
  }
  const past = isPast(t);
  const done = t.days.filter(d => okDate(d.date) ? d.date <= td : past);
  const cities = [];
  done.forEach(d => { const c = cityName(d.city); if(c && !cities.some(x => x.toLowerCase() === c.toLowerCase())) cities.push(c); });
  return { days:done.length, cities };
}

function splitPlaceText(q){
  const clean = String(q || '').replace(/(邮政编码|郵便番号|우편번호|postal code|postcode|zip)\s*[:：]?\s*[\w-]+/gi, '').replace(/\s+/g, ' ').trim();
  let segs = clean.split(/\s*[,，]\s*/).map(s => s.trim()).filter(Boolean);
  if(segs.length > 1 && COUNTRY_NAMES.has(segs[0].toLowerCase())) segs = segs.slice(1).reverse(); // address written country first
  else if(segs.length > 1 && COUNTRY_NAMES.has(segs[segs.length - 1].toLowerCase())) segs = segs.slice(0, -1);
  const name = (segs[0] || clean).replace(/\s+\d{3}-?\d{3,4}$/, '').trim();
  const town = segs.length > 2 ? segs[segs.length - 1].replace(/\s+[\d-]{4,}$/, '').trim() : (segs[1] || '');
  return { query:clean, name, town };
}
// "Chao Zhou Shi" → "chaozhou", so it matches the "Chaozhou" a search result gives.
const townKey = s => String(s || '').toLowerCase().replace(/\b(shi|qu|xian|zhen|city|ku|shi district|district|prefecture|province)\b/g, '').replace(/[^a-zÀ-ɏ一-鿿]/g, '');

function parseMaps(text){
  const raw = (text || '').trim(); if(!raw) return { kind:'empty' };
  const urlM = raw.match(/https?:\/\/\S+/); const t = urlM ? urlM[0] : raw;
  const lines = raw.split(/\n+/).map(s => s.trim()).filter(s => s && !/^https?:\/\//.test(s));
  const num = '(-?\\d{1,3}\\.\\d+)';
  const m = t.match(new RegExp('!3d' + num + '!4d' + num)) || t.match(new RegExp('@' + num + ',' + num))
    || t.match(new RegExp('[?&](?:q|query|ll|destination|center|daddr)=' + num + '(?:,|%2C)\\s*\\+?' + num))

  const parts = /^-?\d/.test(text2) ? { query:'', name:'', town:'' } : splitPlaceText(text2);
  if(m) return { kind:'coords', lat:+m[1], lon:+m[2], name:parts.name || 'Pinned place', via:'link' };
  if(/maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs/.test(t)) return Object.assign({ kind:'short', url:t }, parts);
  if(/google\.[a-z.]+\/maps|maps\.google\.|google\.[a-z.]+\/\?q=/.test(t) && parts.query) return Object.assign({ kind:'nameonly' }, parts);
  if(!urlM && parts.query) return Object.assign({ kind:'nameonly' }, parts); // pasted a name or an address

}
// Finds a place from the text in a link: Google if there is a key, otherwise the free search, trying
// a few wordings and preferring a result in the right town.
async function findFromText(p){
  const hint = addCityHint();
  if(gkey()){ const g = await searchPlacesGoogleText(p.query, ''); if(g && g.length) return g[0]; }
  const tk = townKey(p.town || hint);
  const tries = [];
  if(p.town) tries.push([`${p.name} ${stripTown(p.town)}`, '']);
  if(hint && !p.town) tries.push([p.name, hint]);
  tries.push([p.name, '']);
  if(p.query && p.query !== p.name) tries.push([p.query, '']);
  let first = null;
  for(const [q, h] of tries){
    const res = await searchPlaces(q, h);
    if(!res.length) continue;
    if(!first) first = res[0];
    const inTown = tk ? res.find(r => townKey(r.sub).includes(tk)) : res[0];
    if(inTown) return inTown;
  }

}
let linkSeq = 0;
async function resolveLink(){
  const seq = ++linkSeq; let r = parseMaps(S.link);
  if(r.kind === 'short'){
    if(!library.helperUrl){ S.linkRes = { kind:'nohelper' }; paintLink(); return; }
    S.linkRes = { kind:'loading' }; paintLink();
    try{
      const res = await fetch(library.helperUrl + (library.helperUrl.includes('?') ? '&' : '?') + 'u=' + encodeURIComponent(r.url));
      const j = await res.json(); if(seq !== linkSeq) return;
      const r2 = j && j.url ? parseMaps(j.url) : { kind:'unknown' };
      const parts = j && j.q ? splitPlaceText(j.q) : r2;
      if(r2.kind === 'coords') r = Object.assign(r2, { via:'helper', name:r2.name !== 'Pinned place' ? r2.name : (parts.name || r2.name) });
      else if(j && typeof j.lat === 'number') r = { kind:'coords', lat:j.lat, lon:j.lon, name:parts.name || 'Pinned place', addr:j.address || '', via:'helper' };
      else if(parts && parts.query) r = Object.assign({ kind:'nameonly' }, parts);
      else r = { kind:'helperfail', detail:j && j.error };
    }catch(e){ if(seq !== linkSeq) return; r = { kind:'helperfail' }; }

    S.linkRes = { kind:'loading' }; paintLink();
    const hit = await findFromText(r);
    if(seq !== linkSeq) return;
    r = hit ? { kind:'coords', lat:hit.lat, lon:hit.lon, name:r.name, addr:hit.sub, found:hit.label, via:'name' } : { kind:'notfound', name:r.name };
  }

}
function linkResHTML(){
  const r = S.linkRes || { kind:'empty' };
  if(r.kind === 'empty') return `<p class="sub">In Google Maps, tap Share, then Copy link, and paste it here. Short and full links both work.</p>`;
  if(r.kind === 'loading') return `<p class="sub">Reading the link…</p>`;
  if(r.kind === 'coords') return `<div class="result ok">${I('check')}<div><span class="num">${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}</span>${r.found && r.found !== r.name ? ` <span>${esc(r.found)}</span>` : ''}${r.addr ? `<br><span>${esc(r.addr)}</span>` : ''}<br><span>${r.via === 'helper' ? 'Found through your short-link reader.' : r.via === 'name' ? 'The link had no exact location, so the pin comes from a search. Check it on the map after adding.' : 'The location was read straight from the link.'}</span></div></div>
    <div class="field"><label for="lname">Name</label><input id="lname" class="input" data-in="lname" value="${esc(r.name)}"></div>`;
  if(r.kind === 'nohelper') return `<div class="result warn">${I('alert')}<div><b>Short links need the short-link reader</b><span>Set it up once in Settings. For now, search by name, or add it without a location and drop a pin.</span></div></div>`;
  if(r.kind === 'helperfail') return `<div class="result warn">${I('alert')}<div><b>The short-link reader didn't answer</b><span>${r.detail ? esc(r.detail) + '. ' : ''}Check the reader in Settings, or search by name for now.</span></div></div>`;
  if(r.kind === 'notfound') return `<div class="result warn">${I('alert')}<div><b>Couldn't find “${esc(r.name)}”</b><span>Add it without a location and drop a pin on the map.</span></div></div>`;
  return `<div class="result warn">${I('alert')}<div><b>This isn't a Google Maps link</b><span>Copy the link from the Share button in Google Maps and paste it here.</span></div></div>`;
}
function paintLink(){ const el = document.getElementById('alinkres'); if(el) el.innerHTML = linkResHTML(); }

/* ===== GitHub sync ===== */
const sync = Object.assign({ token:'', repo:DATA_REPO_DEFAULT, expires:'', meta:{}, deleted:{}, settingsSha:'', settingsDirty:false, lastSync:'', status:'', error:'' }, readJSON(LS_SYNC) || {});

function syncMeta(id){ return sync.meta[id] || (sync.meta[id] = { sha:'', dirty:true }); }
let syncTimer = null, syncing = false, syncAgain = false;
function syncSoon(ms = 60000){ if(!sync.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); if(S.syncState !== 'saving'){ S.syncState = 'pending'; paintSync(); } }
function b64encode(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }

async function gh(path, opts = {}){

  }));

// Uploads a trip. If it was edited while uploading, it stays marked for the next sync.
async function pushTrip(id, sha, msg){ const m = syncMeta(id); const v = m.v || 0; const t = library.trips[id]; m.sha = await ghPut(`trips/${id}.json`, t, sha, msg + ' ' + (t.tripName || 'a trip')); m.dirty = (m.v || 0) !== v; }

const sameContent = (a, b) => JSON.stringify({ n:a.tripName, d:a.days, e:a.expenses, c:a.cities }) === JSON.stringify({ n:b.tripName, d:b.days, e:b.expenses, c:b.cities });

async function syncSettings(){
  const r = await ghGet('settings.json'); const remote = r ? r.data : {};

  let changedLocal = false;

  if(!sync.settingsDirty && r) keys.forEach(k => { if(typeof remote[k] === 'string' && remote[k] && remote[k] !== library[k]){ library[k] = remote[k]; changedLocal = true; } });
  const usage = Object.assign({}, remote.usage || {}); if(library.usage[dev.id]) usage[dev.id] = library.usage[dev.id];
  Object.keys(usage).forEach(k => { if(k !== dev.id) library.usage[k] = usage[k]; });

  if(!r || JSON.stringify(out) !== JSON.stringify({ googleApiKey:remote.googleApiKey, cartoApiKey:remote.cartoApiKey, helperUrl:remote.helperUrl, usage:remote.usage || {} })){

async function syncNow(){
  clearTimeout(syncTimer);

  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ S.syncState = 'offline'; paintSync(); return; }
  syncing = true; S.syncState = 'saving'; paintSync();
  saveNow();
  const before = JSON.stringify([library.trips, library.googleApiKey, library.helperUrl, library.cartoApiKey]);
  try{
    // GitHub answers "not found" for a private repo the token can't see, so check the repo itself first.
    const info = await gh('');
    if(!info) throw Object.assign(new Error('no repo'), { status:404, detail:`Can't find ${sync.repo}, or the token isn't allowed to open it. Check the repo name, and that the token's Repository access includes it.` });

      if(!m || !m.dirty){ library.trips[id] = data; sync.meta[id] = { sha:got.sha, dirty:false }; continue; }

      if(remote[id] || downloaded[id]) continue;
      const m = sync.meta[id];

        if(t.updatedAt < twin.updatedAt){ t.tripName = (t.tripName || 'Untitled trip') + ' (older copy)'; }

    const typing = document.activeElement && document.activeElement.matches('input, textarea, select');
    const arrived = before !== JSON.stringify([library.trips, library.googleApiKey, library.helperUrl, library.cartoApiKey]);
    const bannerChanged = !!document.querySelector('.banner') !== !!syncBanner();
    if((arrived || bannerChanged) && !typing && !S.dialog && !drag) render();

function tokenDaysLeft(){ return okDate(sync.expires) ? daysUntil(sync.expires) : null; }
function syncInfo(){

  if(st === 'error') return { ic:'alert', short:'Sync problem', long:'Sync problem, see Settings', s:'stopped' };
  if(st === 'saving') return { ic:'cloud-up', short:'Syncing', long:'Saving to GitHub', s:'saving' };
  if(st === 'offline') return { ic:'cloud-off', short:'Offline', long:'Offline, saved on this device', s:'offline' };
  const dl = tokenDaysLeft();
  if(dl != null && dl <= 14) return { ic:'alert', short:'Token expiring', long:dl < 0 ? 'Sync token has expired' : `Sync token expires in ${dl} ${dl === 1 ? 'day' : 'days'}`, s:'expiring' };

function importBackup(text){

  if(parsed && Array.isArray(parsed.trips)) list = parsed.trips;
  else if(parsed && parsed.trips && typeof parsed.trips === 'object') list = Object.values(parsed.trips);
  else if(parsed && Array.isArray(parsed.days)) list = [parsed];

function pageHead(showSpent = false){
  const t = T(); const tt = totals(t);
  return `<header class="pagehead"><div><label class="visually-hidden" for="tripName">Trip name</label><input id="tripName" class="titleinput" data-in="tripname" value="${esc(t.tripName)}" placeholder="Name this trip"></div>
    <dl class="meta"><div><dt>Dates</dt><dd>${range(tripStart(t), tripEnd(t))}</dd></div><div><dt>Days</dt><dd>${t.kind === 'full' ? t.days.length : tripLen(t)}</dd></div>${showSpent ? `<div><dt>Spent</dt><dd>${fmt(t.baseCurrency, tt.all)}</dd></div>` : ''}</dl></header>`;
}
const tripLabel = t => t.tripName || 'Untitled trip';

/* ===== Home ===== */
function scrHome(){
  const trips = Object.values(library.trips);
  const next = trips.filter(isUpcoming).sort((a, b) => tripStart(a).localeCompare(tripStart(b)))[0];
  const now = findTodayTrip();
  const band = now
    ? `<section class="todayband" aria-label="Today"><div class="nt"><p>Day ${now.i + 1}${now.t.days[now.i].city ? ' in ' + esc(now.t.days[now.i].city) : ''}</p><span>${esc(tripLabel(now.t))}, ${dLong(now.t.days[now.i].date)}</span></div><button type="button" class="btn btn--primary" data-act="gotoday">Open today's plan</button></section>`
    : next ? `<section class="todayband" aria-label="Next trip"><div class="nt"><p>${esc(tripLabel(next))} starts ${startsIn(daysUntil(tripStart(next)))}</p><span>${dLong(tripStart(next))}${tripCities(next).length ? '. ' + tripCities(next).map(esc).join(', ') : ''}</span></div><button type="button" class="btn btn--primary" data-act="opentrip" data-id="${next.id}">Open trip</button></section>` : '';
  const sorted = trips.slice().sort((a, b) => (tripStart(b) || '9999').localeCompare(tripStart(a) || '9999'));
  const rows = sorted.map(t => {
    const st = tripStart(t), en = tripEnd(t);
    const live = now && now.t === t; const up = isUpcoming(t); const done = isPast(t);
    const status = live ? 'Travelling now' : up ? `Starts ${startsIn(daysUntil(st))}` : done ? (t.kind === 'maponly' ? 'Map-only' : `${I('check','sm')}Done`) : okDate(st) ? 'Travelling now' : 'Being planned';
    const len = tripLen(t);
    return `<tr><td><button type="button" class="row-open" data-act="opentrip" data-id="${t.id}">${esc(tripLabel(t))}</button></td><td class="num">${range(st, en)}${len ? `<br><span class="sub">${len} ${len === 1 ? 'day' : 'days'}</span>` : ''}</td><td>${tripCities(t).map(esc).join(', ') || '<span class="sub">No towns yet</span>'}</td><td><span class="status ${done ? 'done' : 'now'}">${status}</span></td>
      <td><button type="button" class="iconbtn" data-act="askdeltrip" data-id="${t.id}" aria-label="Delete ${esc(tripLabel(t))}">${I('x')}</button></td></tr>`;
  }).join('');
  return `<div class="screen">${syncBanner()}${band}
    <section class="worldfig box" aria-labelledby="h-world"><h1 id="h-world">Where you've been</h1>
      ${footHTML()}
    </section>
    <section class="box" aria-labelledby="h-trips"><div class="sechead"><h2 id="h-trips">${I('plane')}Your trips</h2><div class="chips"><button type="button" class="btn" data-act="dialog" data-d="past">${I('plus','sm')}Add a past trip</button><button type="button" class="btn btn--primary" data-act="dialog" data-d="newtrip">${I('plus','sm')}New trip</button></div></div>
      ${trips.length ? `<div class="tablewrap"><table class="trips"><thead><tr><th scope="col">Trip</th><th scope="col">Dates</th><th scope="col">Cities</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Delete</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="sub" style="margin-top:var(--space-md)">Map-only trips just pin their cities. Open one to plan it day by day.</p>`
      : `<p class="empty">No trips yet. Start a new one, or add past trips so they show on the map. Moving from another device? Load a backup in <button type="button" class="link" data-act="nav" data-to="settings">Settings</button>.</p>`}
    </section></div>`;
}
const startsIn = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`;

/* ===== screens for a trip that has no days yet, or is map-only ===== */
function noDaysHTML(t){
  if(t.kind === 'maponly') return `<section class="box mapnote" aria-labelledby="h-mo"><h2 id="h-mo">Map-only trip</h2><p>It pins its cities on your world map. Edit them here, or plan the trip day by day.</p>
    <div class="grid2"><div class="field"><label for="mofrom">First day</label><input id="mofrom" type="date" class="input" data-in="mofrom" value="${esc(t.start)}"></div><div class="field"><label for="moto">Last day</label><input id="moto" type="date" class="input" data-in="moto" value="${esc(t.end)}"></div></div>
    <div class="field"><label for="mocities">Cities</label><input id="mocities" class="input" data-in="mocities" value="${esc(t.cities.join(', '))}" aria-describedby="moc-help"><span class="help" id="moc-help">Separate cities with commas.</span></div>
    <div><button type="button" class="btn btn--primary" data-act="planfull">Plan it day by day</button></div></section>`;
  return `<section class="box mapnote" aria-labelledby="h-nd"><h2 id="h-nd">No days yet</h2><p>Pick the first day of the trip. You can add more days after.</p>
    <div class="field" style="max-width:16rem"><label for="firstday">First day</label><input id="firstday" type="date" class="input" value="${isoLocal(today())}"></div>
    <div><button type="button" class="btn btn--primary" data-act="firstday">Add the first day</button></div></section>`;
}

/* ===== Overview ===== */
function spendSummary(t){
  const tt = totals(t); const cats = CATS.filter(c => tt.by[c.k]);
  return `<section class="summary box" aria-labelledby="h-spent">
      <div><h2 id="h-spent" class="visually-hidden">Spending</h2><p class="sub">Spent so far, in ${t.baseCurrency}</p><p class="figure">${fmt(t.baseCurrency, tt.all)}</p><p class="sub">${rateLine(t)}</p></div>
      ${cats.length ? `<dl class="bars">${barRows(t, tt, cats)}</dl>` : `<p class="sub">No expenses yet. <button type="button" class="link" data-act="nav" data-to="budget">Add them in Budget</button></p>`}
    </section>`;
}
function barRows(t, tt, cats){ return cats.map(c => `<dt><span class="cat-ic c-${CATKEY[c.k]}">${I(c.ic,'sm')}</span>${c.k}</dt><dd><span class="track"><span class="fill c-${CATKEY[c.k]}" style="width:${(tt.by[c.k] / tt.all * 100).toFixed(1)}%"></span></span></dd><dd class="v">${fmt(t.baseCurrency, tt.by[c.k])}</dd>`).join(''); }
function scrOverview(){
  const t = T(); const ti = tripDayIndex(t);
  if(!t.days.length) return `<div class="screen">${syncBanner()}${pageHead()}${t.expenses.length ? spendSummary(t) : ''}${noDaysHTML(t)}</div>`;
  const days = t.days.map((d, i) => {
    const hotels = [...new Set(d.places.filter(p => p.type === 'hotel').map(p => p.name))];
    const plan = planOf(d);
    const rows = plan.map(e => {
      if(e.kind === 'divider') return '<li class="anytime">Any time</li>';
      const grip = (what, idx, name) => `<button type="button" class="handle" data-drag="ov" data-what="${what}" data-day="${i}" data-idx="${idx}" aria-label="Move ${esc(name)}: drag, or use arrow keys (up and down within the day, left and right to another day)">${I('grip')}</button>`;
      if(e.kind === 'place'){ const p = e.p; return `<li class="ovrow" data-row="p:${i}:${e.pi}"><span class="pt">${e.t || ''}</span>${grip('p', e.pi, p.name)}<span class="badge c-${p.category}">${e.n}</span><div class="ovtext"><b><span class="cat-ic c-${p.category}">${I(placeIcon(p),'sm')}</span>${esc(p.name)}</b>${p.note ? `<span class="ovnote">${esc(p.note)}</span>` : ''}</div></li>`; }
      if(e.kind === 'step') return `<li class="ovrow" data-row="s:${i}:${e.k}"><span class="pt">${e.t || ''}</span>${grip('s', e.k, e.d || 'this step')}<span class="badge c-${e.sk}">${e.n}</span><div class="ovtext"><b><span class="cat-ic c-${e.sk}">${I(STEPIC[e.sk],'sm')}</span>${esc(e.d) || 'No description'}</b></div></li>`;
      const fp = e.p; const lands = e.t && e.t === fp.arriveTime && fp.arriveTime !== fp.departTime;
      return `<li class="ovrow" data-row="f:${i}:${e.pi}"><span class="pt">${e.t || ''}</span><span></span><span class="badge c-air">${e.n}</span><div class="ovtext"><b><span class="cat-ic c-air">${I('plane','sm')}</span>${esc(fp.name)}</b><span class="ovnote">${e.t ? `${lands ? 'Lands' : 'Departs'} ${e.t}` : 'Times not set'}${fp.note ? '. ' + esc(fp.note) : ''}</span></div></li>`;
    }).join('');
    return `<li class="ov-day" data-day="${i}">
      <div class="ov-when"><b>Day ${i + 1}</b><span>${dMid(d.date)}</span>${i === ti ? '<span class="now">Today</span>' : ''}</div>
      <div class="ov-body">
        <h3><button type="button" class="row-open" data-act="day" data-i="${i}">${esc(d.city) || 'Where to?'}</button></h3>
        ${hotels.length ? `<ul class="facts">${hotels.map(h => `<li><span class="cat-ic c-hotel">${I('bed','sm')}</span>${esc(h)}</li>`).join('')}</ul>` : ''}
        ${d.notes ? `<p class="ovdaynote">${esc(d.notes)}</p>` : ''}
        ${plan.length ? `<ol class="ovplan">${rows}</ol>` : '<p class="sub">Nothing planned yet. Drop a place here from another day.</p>'}
      </div>
      <div class="ov-move"><button type="button" class="btn btn--quiet daymove" data-act="moveday" data-i="${i}" data-d="-1" aria-label="Move Day ${i + 1} earlier" ${i === 0 ? 'disabled' : ''}>${I('up','sm')}<span class="lbl">Earlier</span></button><button type="button" class="btn btn--quiet daymove" data-act="moveday" data-i="${i}" data-d="1" aria-label="Move Day ${i + 1} later" ${i === t.days.length - 1 ? 'disabled' : ''}>${I('down','sm')}<span class="lbl">Later</span></button></div>
    </li>`;
  }).join('');
  return `<div class="screen">${syncBanner()}${pageHead()}
    ${spendSummary(t)}
    ${tripMapPanel('ov')}
    <section aria-labelledby="h-days"><div class="sechead"><h2 id="h-days">Day by day</h2><button type="button" class="btn btn--quiet" data-act="print">${I('print','sm')}Save as PDF</button></div>
      <div class="ovkey"><ul class="legend" aria-label="Key">${[['attraction','pin','Sight'],['food','bowl','Food'],['activity','flag','Activity'],['transport','train','Transport'],['air','plane','Flight'],['hotel','bed','Hotel']].map(([c, ic, l]) => `<li><span class="keydot c-${c}"></span><span class="cat-ic c-${c}">${I(ic,'sm')}</span>${l}</li>`).join('')}</ul>
      <p class="sub">Drag a stop by its handle to move it to another day, or select the handle and use the arrow keys. Earlier and Later swap whole days; the dates stay in order.</p></div>
      <ol class="daylist">${days}</ol>
      <div style="margin-top:var(--space-lg)"><button type="button" class="btn" data-act="addday">${I('plus','sm')}Add a day</button></div></section></div>`;
}

/* ===== Itinerary ===== */
function moveSelect(id, attrs, i){ const t = T(); return `<div class="item-tools"><label for="${id}">Move to</label><select id="${id}" ${attrs}>${t.days.map((d, j) => `<option value="${j}" ${j === i ? 'selected' : ''}>${esc(dayLabel(d, j))}</option>`).join('')}</select></div>`; }
function itemHTML(p, i, pi, t = null, n = null){
  const trip = T(); const timed = t !== null;
  const flightSub = [p.departTime ? 'Departs ' + p.departTime : '', p.arriveTime ? 'arrives ' + p.arriveTime : ''].filter(Boolean).join(', ');
  const sub = p.type === 'flight' ? (flightSub ? flightSub[0].toUpperCase() + flightSub.slice(1) : 'Times not set') : p.type === 'hotel' ? `${stayText(trip, p.name)}${p.address ? '. ' + p.address : ''}` : p.address;
  const cls = p.type === 'activity' ? 'c-' + p.category : p.type === 'flight' ? 'c-air' : 'c-hotel';
  const badge = n != null ? `<span class="badge ${cls}">${n}</span>` : `<span class="badge ${cls}">${I(placeIcon(p),'sm')}</span>`;
  const editing = S.editItem === p.id;
  const noPin = p.type !== 'flight' && p.lat == null;
  const move = p.type !== 'hotel' ? moveSelect('mv' + p.id, `data-in="moveto" data-id="${p.id}"`, i) : '';
  const timeField = p.type === 'activity' ? `<div class="field" style="max-width:12rem"><label for="pt${p.id}">Time (optional)</label><input id="pt${p.id}" type="time" class="input num" data-in="ptime" data-id="${p.id}" value="${p.time || ''}"></div>`
    : p.type === 'flight' ? `<div class="grid2"><div class="field"><label for="fd${p.id}">Departs</label><input id="fd${p.id}" type="time" class="input num" data-in="pdep" data-id="${p.id}" value="${p.departTime || ''}"></div><div class="field"><label for="fa${p.id}">Arrives</label><input id="fa${p.id}" type="time" class="input num" data-in="parr" data-id="${p.id}" value="${p.arriveTime || ''}"></div></div>` : '';
  const kindField = p.type === 'activity' ? `<div class="seg" role="group" aria-label="Type"><button type="button" data-act="pcat" data-id="${p.id}" data-c="attraction" aria-pressed="${p.category === 'attraction'}">Sight</button><button type="button" data-act="pcat" data-id="${p.id}" data-c="food" aria-pressed="${p.category === 'food'}">Food</button></div>` : '';
  const edit = editing ? `<div class="item-edit">${kindField}<div class="field"><label for="pn${p.id}">Name</label><input id="pn${p.id}" class="input" data-in="pname" data-id="${p.id}" value="${esc(p.name)}"></div>${timeField}<div class="field"><label for="nt${p.id}">${p.type === 'flight' ? 'Booking details' : 'Note'}</label><textarea id="nt${p.id}" class="input" rows="2" data-in="pnote" data-id="${p.id}" placeholder="${p.type === 'flight' ? 'Booking reference, seats, terminal' : 'Why you picked it, what to order'}">${esc(p.note)}</textarea></div>${move}<div class="chips"><button type="button" class="btn" data-act="doneitem">Done</button>${p.type !== 'flight' && p.lat != null ? `<button type="button" class="btn btn--quiet" data-act="pick" data-id="${p.id}">Move the pin</button>` : ''}</div></div>` : '';
  return `<li class="item ${timed ? 'timed' : ''}" ${p.type === 'activity' ? `data-drag-item="p:${i}:${pi}"` : ''}>
    ${timed ? `<span class="pt">${t || ''}</span>` : ''}${p.type === 'activity' ? `<button type="button" class="handle" data-drag="it" data-what="p" data-day="${i}" data-idx="${pi}" aria-label="Move ${esc(p.name)}: drag, or use arrow keys">${I('grip')}</button>` : '<span></span>'}${badge}
    <div class="item-main"><div class="item-name">${n != null ? `<span class="cat-ic ${cls}">${I(placeIcon(p),'sm')}</span>` : ''}${p.lat != null ? `<button type="button" class="row-open" data-act="showpin" data-id="${p.id}" aria-label="Show ${esc(p.name)} on the map">${esc(p.name)}</button>` : esc(p.name)}</div>${sub ? `<div class="item-sub">${esc(sub)}</div>` : ''}
      ${p.note && !editing ? `<p class="item-note">${esc(p.note)}</p>` : ''}
      ${noPin ? `<div class="nomap">${I('alert','sm')}Not on the map yet. <button type="button" class="link" data-act="pick" data-id="${p.id}">Drop a pin</button></div>` : ''}${edit}</div>
    <span class="item-acts">${editing ? '' : `<button type="button" class="iconbtn" data-act="edititem" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">${I('pen')}</button>`}<button type="button" class="iconbtn" data-act="delplace" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">${I('x')}</button></span></li>`;
}
function stepHTML(e, i){
  const k = e.k; const s = T().days[i].logistics[k]; const sk = s.kind || 'transport';
  const grip = `<button type="button" class="handle" data-drag="it" data-what="s" data-day="${i}" data-idx="${k}" aria-label="Move ${esc(s.desc || 'this step')}: drag, or use arrow keys">${I('grip')}</button>`;
  if(S.editTime === k) return `<li class="item timed step editing" data-drag-item="s:${i}:${k}"><span class="pt">${s.time || ''}</span>${grip}<span class="badge c-${sk}">${e.n}</span>
    <div class="item-main"><div class="item-name"><span class="cat-ic c-${sk}">${I(STEPIC[sk],'sm')}</span>${esc(s.desc) || 'New step'}</div><div class="item-edit"><div class="seg" role="group" aria-label="Kind of step"><button type="button" data-act="stepkind" data-k="${k}" data-v="activity" aria-pressed="${sk === 'activity'}">Activity</button><button type="button" data-act="stepkind" data-k="${k}" data-v="transport" aria-pressed="${sk === 'transport'}">Transport</button></div><div class="field" style="max-width:12rem"><label for="tt${k}">Time</label><input id="tt${k}" type="time" class="input num" data-in="ttime" data-k="${k}" value="${s.time || ''}"></div>
    <div class="field"><label for="td${k}">What happens</label><textarea id="td${k}" class="input" rows="2" data-in="tdesc" data-k="${k}" placeholder="Grab to the airport, meet the driver in the lobby">${esc(s.desc)}</textarea></div>${moveSelect(`ms${i}-${k}`, `data-in="movestep" data-k="${k}"`, i)}<div><button type="button" class="btn" data-act="donetime">Done</button></div></div></div><span class="item-acts"></span></li>`;
  return `<li class="item timed step" data-drag-item="s:${i}:${k}"><span class="pt">${s.time || ''}</span>${grip}<span class="badge c-${sk}">${e.n}</span><div class="item-main"><div class="item-name"><span class="cat-ic c-${sk}">${I(STEPIC[sk],'sm')}</span>${esc(s.desc) || '<span class="sub">No description</span>'}</div></div>
    <span class="item-acts"><button type="button" class="iconbtn" data-act="edittime" data-k="${k}" aria-label="Edit ${esc(s.desc || 'this step')}">${I('pen')}</button><button type="button" class="iconbtn" data-act="deltime" data-k="${k}" aria-label="Remove ${esc(s.desc || 'this step')}">${I('x')}</button></span></li>`;
}
// The trip map with its controls. Itinerary shows it beside the day; Overview shows it above the days.
// Either can go full screen.
function tripMapPanel(where){
  const t = T(); const nums = numbering(t); const i = S.day; const ov = where === 'ov';
  const focusPl = S.mapFocus ? findPlace(S.mapFocus) : null;
  const filter = focusPl ? t.days.indexOf(focusPl.d) : (ov || S.mapMode === 'trip') ? 'all' : i;
  const whole = filter === 'all';
  const groups = t.days.map((d, j) => { const o = d.places.filter(p => p.type !== 'flight' && p.lat != null); return o.length ? `<optgroup label="${esc(dayLabel(d, j).replace(/, \d+ \w+,/, ','))}">${o.map(p => `<option value="${p.id}" ${S.mapFocus === p.id ? 'selected' : ''}>${p.type === 'hotel' ? esc(p.name) + ' (hotel)' : nums[p.id] + '. ' + esc(p.name)}</option>`).join('')}</optgroup>` : ''; }).join('');
  const unplaced = ov ? [] : t.days[i].places.filter(p => p.lat == null && p.type !== 'flight');
  let popup = '';
  if(S.mapPopup){ const f = findPlace(S.mapPopup); if(f){ const p = f.p; const di = t.days.indexOf(f.d); popup = `<div class="popup"><div class="top"><b>${p.type === 'hotel' ? '' : (nums[p.id] || '') + '. '}${esc(p.name)}</b><button type="button" class="iconbtn" data-act="closepop" aria-label="Close details">${I('x','sm')}</button></div><span class="sub">${p.type === 'hotel' ? 'Hotel, ' + dayList(hotelDays(t, p.name)) : 'Day ' + (di + 1) + (f.d.city ? ', ' + esc(f.d.city) : '') + (p.time ? ', ' + p.time : '')}</span>${ov || di !== S.day ? `<div><button type="button" class="link" data-act="day" data-i="${di}">Open Day ${di + 1}</button></div>` : ''}${p.address ? `<span class="sub">${esc(p.address)}</span>` : ''}${p.note ? `<p>${esc(p.note)}</p>` : ''}<div class="chips"><a class="link" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Open in Google Maps</a></div></div>`; } }
  const picking = S.picking ? findPlace(S.picking) : null;
  S.lastMap = { filter, focus:S.mapFocus, picking:!!picking, curDay:i };
  const full = S.mapFull;
  const top = ov
    ? `<div class="sechead"><h2 id="h-map">${I('pin')}Map</h2>${full ? `<button type="button" class="btn" data-act="mapfull">${I('x','sm')}Close</button>` : ''}</div>`
    : `<div class="maptop"><div class="seg" role="group" aria-label="Map shows"><button type="button" data-act="mapm" data-m="day" aria-pressed="${S.mapMode === 'day'}">This day</button><button type="button" data-act="mapm" data-m="trip" aria-pressed="${S.mapMode === 'trip'}">Whole trip</button></div>${full ? `<button type="button" class="btn" data-act="mapfull">${I('x','sm')}Close</button>` : ''}</div>`;
  return `<${ov ? 'section' : 'aside'} class="${ov ? 'ovmap' : 'mapcol'} box ${full ? 'mapfull' : ''}" aria-label="Map" ${full ? 'role="dialog" aria-modal="true"' : ''}>
    ${top}
    ${whole && !focusPl ? `<div class="seg" role="group" aria-label="Pins show"><button type="button" data-act="tripshow" data-v="days" aria-pressed="false">Days</button><button type="button" data-act="tripshow" data-v="places" aria-pressed="false">Every place</button></div>` : ''}
    <div class="mapbox">${picking ? `<div class="pickbar"><span>Tap the map where ${esc(picking.p.name)} is.</span><button type="button" class="btn" data-act="pickcancel">Cancel</button></div>` : ''}<div class="tmapwrap" data-map="trip"></div>${full ? '' : `<button type="button" class="iconbtn mapfullbtn" data-act="mapfull" aria-label="Show the map full screen">${I('expand')}</button>`}</div>
    ${popup || `<p class="sub maphint">${whole && !focusPl ? 'Zoomed out, each day gets one marker. Zoom in, or tap a day marker, to see every place with its number.' : 'Select a pin to see its details.'}</p>`}
    ${S.mapFocus ? `<div><button type="button" class="link" data-act="unfocus">Show the whole ${whole || ov ? 'trip' : 'day'} again</button></div>` : ''}

const HELPER_SCRIPT = "// Milo & Miles short-link reader. Opens a Google Maps short link and finds where the place is.\nfunction doGet(e) {\n  var u = String((e && e.parameter && e.parameter.u) || '').trim();\n  if (!/^https:\\/\\/(maps\\.app\\.goo\\.gl|goo\\.gl\\/maps|g\\.co\\/kgs)\\//.test(u)) return out({ error: 'Not a Google Maps short link' });\n  var url = u;\n  for (var i = 0; i < 5 && /^https:\\/\\/(maps\\.app\\.goo\\.gl|goo\\.gl|g\\.co)\\//.test(url); i++) {\n    var r = UrlFetchApp.fetch(url, { followRedirects: false, muteHttpExceptions: true });\n    var h = r.getHeaders();\n    var next = h['Location'] || h['location'];\n    if (!next) break;\n    url = next;\n  }\n  var res = { url: url };\n  if (/!3d-?\\d|@-?\\d+\\.\\d+,/.test(url)) return out(res);\n  var m = url.match(/[?&](?:q|query)=([^&#]+)/) || url.match(/\\/maps\\/place\\/([^\\/@?]+)/);\n  if (m) {\n    res.q = decodeURIComponent(m[1].replace(/\\+/g, ' '));\n    try {\n      var g = Maps.newGeocoder().setLanguage('en').geocode(res.q);\n      if (g.status === 'OK' && g.results.length) {\n        var loc = g.results[0].geometry.location;\n        res.lat = loc.lat; res.lon = loc.lng; res.address = g.results[0].formatted_address;\n      }\n    } catch (err) { res.geocodeError = String(err); }\n  }\n  return out(res);\n}\nfunction out(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";

function leafletAdapter(el, opts){

  return { kind:'leaflet', el,
    theme(dark){ const sig = dark + '|' + library.cartoApiKey; if(sig === tileSig) return; tileSig = sig; if(tiles) map.removeLayer(tiles); tiles = tileLayer(dark).addTo(map); },
    zoom: () => map.getZoom(),
    setView: (lat, lon, z) => map.setView([lat, lon], z),
    fit: (pts, maxZoom) => map.fitBounds(L.latLngBounds(pts), { padding:[40, 40], maxZoom }),
    clear: () => layer.clearLayers(),
    pin: (lat, lon, o) => { const w = o.w || o.size; L.marker([lat, lon], { icon:L.divIcon({ className:'lpin-wrap', html:o.html, iconSize:[w, o.size], iconAnchor:[o.ax ?? w / 2, o.ay ?? o.size / 2] }), title:o.title, alt:o.title, keyboard:true, riseOnHover:true, zIndexOffset:o.z || 0 }).on('click', o.onClick).addTo(layer); },
    line: (pts, o = {}) => L.polyline(pts, { className:o.cls || 'lroute', weight:o.weight || 2, dashArray:o.dashed ? '5 6' : null, interactive:false }).addTo(layer),
    onClick: cb => map.on('click', ev => cb(ev.latlng.lat, ev.latlng.lng)),
