/* ===== base (scaffolded) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { font-size: calc(106.25% * var(--scale)); scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

[hidden] { display: none !important; }

.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

/* ===== controls ===== */

.ic.sm { width: 16px; height: 16px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }

/* ===== page heads ===== */

.titleinput { width: min(100%, 24ch); padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; font-family: var(--font-display); font-weight: var(--display-weight); font-size: var(--text-display); letter-spacing: var(--tracking-display); line-height: 1.15; color: var(--color-ink); outline: 2px solid transparent; outline-offset: 4px; }

/* ===== ruled lists (the timetable family) ===== */

/* ===== home ===== */
.home-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--space-lg); }
@media (max-width: 40rem) { .home-head { grid-template-columns: minmax(0, 1fr); } }

.worldfig { margin: 0; display: flex; flex-direction: column; gap: var(--space-md); }

.wm-lab { position: absolute; transform: translate(10px, -50%); font-size: var(--text-sm); line-height: 1.1; color: var(--color-ink); white-space: nowrap; pointer-events: none; text-shadow: 0 0 3px var(--color-map-sea), 0 0 2px var(--color-map-sea); }

@media (max-width: 48rem) { .wm-lab:not(.hl):not(.home) { display: none; } }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); margin: 0; padding: 0; list-style: none; font-size: var(--text-sm); color: var(--color-muted); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; }

@media (max-width: 40rem) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--space-md); } .stats div:nth-child(3) { padding-left: 0; border-left: 0; } }
.trips { width: 100%; border-collapse: collapse; }
.tablewrap { overflow-x: auto; }

  .trips td, .ledger td { display: block; padding: 0; border: 0; text-align: left; }
  .trips td:nth-child(1) { grid-column: 1; } .trips td:nth-child(5) { grid-column: 2; grid-row: 1; }
  .trips td:nth-child(2), .trips td:nth-child(3), .trips td:nth-child(4) { grid-column: 1 / -1; font-size: var(--text-sm); }
  .row-open { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: var(--text-lg); }
  .ledger tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2xs) var(--space-sm); padding-block: var(--space-md); border-bottom: 1px solid var(--color-rule); }
  .ledger td:nth-child(2) { grid-column: 1; grid-row: 1; } .ledger td:nth-child(4) { grid-column: 2; grid-row: 1; }
  .ledger td:nth-child(1) { grid-column: 1; grid-row: 2; font-size: var(--text-sm); color: var(--color-muted); } .ledger td:nth-child(5) { grid-column: 2; grid-row: 2; font-size: var(--text-sm); color: var(--color-muted); }
  .ledger td:nth-child(3) { grid-column: 1 / -1; } .ledger td:nth-child(6) { grid-column: 1 / -1; text-align: left; }

.status { display: inline-flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-md); color: var(--color-ink-2); white-space: nowrap; }

/* ===== overview ===== */

.pchips { display: flex; flex-wrap: wrap; gap: var(--space-xs); min-height: var(--control-h); align-items: center; }
.pchip { position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-sm) 0 var(--space-2xs); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink); font-size: var(--text-sm); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }

@media (max-width: 40rem) { .ov-day { grid-template-columns: minmax(0, 1fr) auto; } .ov-when { grid-column: 1 / -1; flex-direction: row; gap: var(--space-sm); align-items: baseline; } .ov-move { flex-direction: row; } }

/* ===== itinerary ===== */
.daystrip { display: flex; gap: var(--space-2xs); overflow-x: auto; border-bottom: 1px solid var(--color-rule); scrollbar-width: thin; }
.daytab { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3xs); min-height: 44px; padding: var(--space-sm) var(--space-md); border: 0; background: none; color: var(--color-muted); text-align: left; cursor: pointer; transition: color var(--dur-short) var(--ease-out); }

@media (hover: hover) { .daytab:hover b { color: var(--color-ink); } }

@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); } }
.plan { display: flex; flex-direction: column; gap: var(--space-xl); min-width: 0; }

.nextup { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm) var(--space-lg); padding: var(--space-lg); border-radius: var(--radius-card); background: var(--color-ink); color: var(--color-paper); }
.nextup .t, .nextup .what b { color: var(--color-paper); } .nextup .what span { color: var(--color-paper-3); }
.nextup .btn { border-color: var(--color-paper-3); color: var(--color-paper); }
@media (hover: hover) { .nextup .btn:hover:not(:disabled) { background: var(--color-paper); color: var(--color-ink); } }
.nextup .t { font-family: var(--font-body); font-weight: 600; letter-spacing: -0.02em; font-size: var(--text-3xl); color: var(--color-ink); font-variant-numeric: tabular-nums; line-height: 1; }
.nextup .what { display: flex; flex-direction: column; }
.nextup .what span { font-size: var(--text-sm); color: var(--color-muted); }
.nextup .what b { font-weight: 400; color: var(--color-ink); font-size: var(--text-lg); }
@media (max-width: 40rem) { .nextup { grid-template-columns: auto minmax(0, 1fr); } .nextup .btn { grid-column: 1 / -1; justify-self: start; } }
.details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: var(--space-lg); }
@media (max-width: 40rem) { .details { grid-template-columns: minmax(0, 1fr); } }
.tt { display: grid; grid-template-columns: 6rem minmax(0, 1fr) auto; gap: var(--space-md); align-items: start; padding-block: var(--space-xs); }
.tt .line { font-size: var(--text-md); }
.tt-t { font-family: var(--font-body); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.tt-d { padding-top: var(--space-2xs); color: var(--color-ink-2); }
.tt-acts { display: flex; gap: var(--space-3xs); }
.tt.editing { grid-template-columns: 8rem minmax(0, 1fr) auto; }
@media (max-width: 40rem) { .tt { grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: var(--space-sm); } .tt.editing { grid-template-columns: minmax(0, 1fr) auto; } .tt.editing textarea { grid-column: 1 / -1; grid-row: 2; } }
.tt input[type="time"] { font-variant-numeric: tabular-nums; color: var(--color-ink); }
.item { display: grid; grid-template-columns: 28px 32px minmax(0, 1fr) var(--control-h); gap: var(--space-xs) var(--space-md); align-items: start; padding-block: var(--space-md); transition: box-shadow var(--dur-short) var(--ease-out); }
.item.before { box-shadow: inset 0 3px 0 var(--color-accent); }

.handle { position: relative; display: grid; place-items: center; width: 28px; height: var(--control-h); padding: 0; border: 0; background: none; color: var(--color-muted); cursor: grab; touch-action: none; }
.handle::before { content: ""; position: absolute; inset: -4px -8px; }

.badge { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-top: var(--space-2xs); border-radius: 50%; border: 1px solid var(--color-ink); color: var(--color-ink); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.badge.cur { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.badge.plain { border-color: var(--color-rule); color: var(--color-muted); }
.item-main { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.item-name { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; font-weight: 500; font-size: var(--text-lg); color: var(--color-ink); line-height: 1.3; }

.item-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-md); margin-top: var(--space-2xs); font-size: var(--text-sm); }
.item-tools select { min-height: 36px; padding: 0 var(--space-xs); border: 1px solid var(--color-muted); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink); font-size: var(--text-sm); outline: 2px solid transparent; outline-offset: 1px; }
.item-tools select:focus-visible { outline-color: var(--color-focus); }
.dayactions { display: flex; flex-wrap: wrap; gap: var(--space-xs); padding-top: var(--space-lg); border-top: 1px solid var(--color-rule); }
.mapcol { position: sticky; top: calc(var(--bar-h) + var(--space-lg)); display: flex; flex-direction: column; gap: var(--space-md); }
@media (max-width: 64rem) { .mapcol { position: static; } .mapcol .tripmap { aspect-ratio: 16 / 10 !important; } }

.facts .cat-ic .ic, .item-name .cat-ic .ic, .ovtext .cat-ic .ic { color: var(--cat); }

/* ===== alignment pass: one row geometry, one control height ===== */
:root { --control-h: 44px; --row-time: 3.5rem; --row-handle: 28px; --row-badge: 32px; --row-gap: var(--space-sm); --row-lane: var(--control-h); }

/* overview rows use the same columns, on a 32px lane */

/* one control height */
input.input, select.input, .item-tools select { height: var(--control-h); padding-block: 0; }
.item-tools select { max-width: 100%; }
.seg button { min-height: 40px; }
/* editor panels */
.item-edit .seg { align-self: flex-start; background: var(--color-paper-3); }
.item-edit .item-tools { flex-direction: column; align-items: flex-start; gap: var(--space-2xs); margin-top: 0; }

/* edges */
.daytab:first-child { padding-left: 0; }
.bud-top > .panel { padding: var(--space-lg); }
/* hierarchy: the day leads on Itinerary, the trip name steps back */
.it-screen .titleinput { font-size: var(--text-2xl); }
.it-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }
.dayhead .daynote { margin-top: var(--space-sm); padding: 0; background: none; border: 0; max-width: 60ch; color: var(--color-ink-2); }
/* iPad portrait and phone: overview days stack, arrows sit beside the day label */
@media (max-width: 52rem) {
  .ov-day { grid-template-columns: minmax(0, 1fr) auto; }
  .ov-when { grid-column: 1; flex-direction: row; align-items: baseline; gap: var(--space-sm); padding-right: 0; border-right: 0; }
  .ov-move { grid-column: 2; grid-row: 1; flex-direction: row; margin-top: -10px; }

}
@media (max-width: 40rem) {
  :root { --row-time: 2.75rem; --row-handle: 22px; --row-gap: var(--space-xs); }
  .item, .item.timed { grid-template-columns: var(--row-time) var(--row-handle) var(--row-badge) minmax(0, 1fr); }
  .item .item-acts, .item.timed .item-acts { grid-column: 4; justify-content: flex-start; margin-left: -10px; }

}

/* ===== map column: wider, pinned beside the plan, as tall as the screen ===== */
.it-grid { grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: var(--space-xl); }
@media (min-width: 64.01rem) {
  .mapcol { position: sticky; top: calc(var(--bar-h) + var(--space-md)); height: calc(100dvh - var(--bar-h) - var(--space-xl)); max-height: 60rem; overflow: auto; }
  .mapcol > div:has(.tmapwrap) { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 20rem; }

}
@media (max-width: 64rem) { .it-grid { grid-template-columns: minmax(0, 1fr); } }

.maphint { font-size: var(--text-sm); }

/* ===== day moves and handles ===== */

/* ===== live map (Leaflet) ===== */

/* ===== app extras ===== */

.mapnote { display: flex; flex-direction: column; gap: var(--space-md); }
.steps { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: var(--space-xs); }
.steps a { color: var(--color-ink); text-decoration-color: var(--color-accent); }
.codebox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-xs); line-height: 1.5; white-space: pre; overflow: auto; }
.dialog details > summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; color: var(--color-ink); }
.dialog details[open] { display: flex; flex-direction: column; gap: var(--space-sm); }
a.btn { text-decoration: none; }
.tab:disabled { opacity: 0.45; cursor: not-allowed; }


/* ===== colours: one colour (the accent) for every stop; hotels and what's coming up get the second colour ===== */
:root { --color-visited: var(--color-accent); --color-upcoming: oklch(62% 0.16 45); --color-mark-2: var(--color-ink-2); --color-mark-2-ink: var(--color-paper); --color-home: oklch(53% 0.18 8); }
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) { --color-upcoming: var(--color-ink); --color-mark-2: oklch(85% 0.12 168); --color-mark-2-ink: oklch(20% 0.04 168); --color-home: oklch(74% 0.15 2); }
}
:root[data-theme="dark"] { --color-upcoming: var(--color-ink); --color-mark-2: oklch(85% 0.12 168); --color-mark-2-ink: oklch(20% 0.04 168); --color-home: oklch(74% 0.15 2); }
.c-air, .c-sight, .c-attraction, .c-food, .c-transport, .c-activity, .c-misc { --cat: var(--color-accent); }
.c-hotel { --cat: var(--color-mark-2); }
.badge.c-attraction, .badge.c-food, .badge.c-transport, .badge.c-activity, .badge.c-air { color: var(--color-accent-ink); }
.badge.c-hotel { color: var(--color-mark-2-ink); }
.keydot { display: none; }
.key { background: var(--color-visited); }

/* ===== map pins ===== */

.lpin.bubble { width: auto; min-width: 100%; padding: 0 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 8px oklch(0% 0 0 / 0.35); }
.daykey { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-xs); margin: 0; padding: 0; list-style: none; }
.daykey button { display: inline-flex; align-items: center; min-height: 36px; padding: 0 var(--space-sm); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); background: none; color: var(--color-ink-2); font-size: var(--text-sm); cursor: pointer; }
.daykey button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
@media (hover: hover) { .daykey button:hover { border-color: var(--color-ink); color: var(--color-ink); } }

/* ===== home: footprint map, every place you've been lit up ===== */
.worldfig { gap: var(--space-lg); }
.fp-card { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: var(--space-lg) 0; border: 1px solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-card); }
.fp-stat { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; padding-inline: var(--space-lg); border-left: 1px solid var(--color-rule); }

.fp-stat.main .fp-num b { color: var(--color-visited); }
.fp-num span { font-size: var(--text-lg); color: var(--color-muted); }
.fp-bar { height: 5px; margin-top: var(--space-2xs); border-radius: 3px; background: var(--color-paper-3); overflow: hidden; }
.fp-bar span { display: block; height: 100%; border-radius: 3px; background: var(--color-visited); }
.fp-legend { justify-content: flex-end; margin-bottom: calc(var(--space-sm) * -1); }
@media (max-width: 52rem) {
  .fp-card { grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: var(--space-lg); }

  .fp-stat:not(.main) { grid-column: span 2; }
  .fp-stat:nth-child(3) { border-left: 0; }
}
@media (max-width: 40rem) { .fp-stat { padding-inline: var(--space-md); } .fp-stat .wide { display: none; } .fp-num b { font-size: 1.9rem; } }
.fp-map { position: relative; aspect-ratio: 2 / 1; border-radius: 8px; overflow: hidden; background: var(--color-map-sea); touch-action: pan-y; -webkit-user-select: none; user-select: none; cursor: grab; }

@media (max-width: 40rem) { .fp-map { aspect-ratio: 4 / 3.6; } }

.fp-sea { fill: var(--color-map-sea); }
.fp-u { fill: var(--color-map-land); stroke: var(--color-map-land); stroke-width: 0.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.fp-map.z2 .fp-u { stroke: color-mix(in oklab, var(--color-map-edge) 70%, var(--color-map-land)); }

.fp-up { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); }
.fp-up::before { content: ''; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--color-upcoming); }
.fp-map .wm-zoom { position: absolute; right: var(--space-xs); bottom: var(--space-xs); display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--space-2xs); }
.fp-map .wm-zoom .iconbtn { width: 40px; height: 40px; background: var(--color-card); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); }

/* ===== trip map panel: on Overview, and full screen ===== */
.ovmap { display: flex; flex-direction: column; gap: var(--space-md); }

.mapfullbtn { position: absolute; top: var(--space-xs); right: var(--space-xs); z-index: 500; width: 40px; height: 40px; background: var(--color-card); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); box-shadow: var(--shadow-card); }

.mapfull { position: fixed !important; inset: 0; z-index: var(--z-modal); height: 100dvh !important; max-height: none !important; margin: 0; border: 0; border-radius: 0; display: flex; flex-direction: column; gap: var(--space-sm); padding: max(var(--space-md), env(safe-area-inset-top)) var(--space-md) max(var(--space-md), env(safe-area-inset-bottom)); overflow-y: auto; background: var(--color-section); }

body.noscroll { overflow: hidden; }

/* ===== map tiles: OpenStreetMap is muted so it reads as a quiet backdrop ===== */

.gmap-pin { position: absolute; cursor: pointer; }
.gmap-pin:focus-visible { outline: none; }

/* text on the 'now' colour */
:root { --color-now-ink: var(--color-accent-ink); }
.tab .today { color: var(--color-now-ink); }

}

/* ===== print (Save as PDF from Overview) ===== */
@media print {
  :root { --scale: 0.85; }
  html, body { background: #fff !important; color: #000; }
  .bar, .banner, .btn, .handle, .ov-move, .ovkey .sub, .toast, #live, .overlay, .daymove, .iconbtn { display: none !important; }
  .box, .summary { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
  .ov-day { break-inside: avoid; }
  .wrap { max-width: none; padding: 0; }
}

/* ===== the lock screen, before the app ===== */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--space-xl) var(--space-md); }
.gate-card { width: 100%; max-width: 30rem; display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-xl) var(--space-lg); }

function fitFoot(){

  keys.forEach(k => { const u = WM.byKey[k]; if(u){ const r = Math.max(u.w * 0.6, 20); add([u.c[0] - r, u.c[1] - r * 0.7, u.c[0] + r, u.c[1] + r * 0.7]); } });

function searchResHTML(){

function blankDraft(t, cat = 'Hotel'){
  const td = isoLocal(today()); const st = tripStart(t);
  return { cat, desc:'', date: t.days.some(d => d.date === td) ? td : (st || td), cur:t.currency, total:'', nights:'', unit:'', qty:'' };
}
function draftPreview(){
  const t = T(); const d = S.draft; const m = catOf(d.cat).mode; const tb = t.baseCurrency; const cv = (n) => conv(t, d.cur, tb, n);
  if(m === 'nights'){ const tot = parseFloat(d.total), n = parseInt(d.nights); if(!(tot > 0)) return { empty:true, big:'Fill in the total and nights to see the price per night' }; if(!(n > 0)) return { big:fmt(d.cur, tot), small:'Add the number of nights to see the price per night' }; return { big:`${fmt(d.cur, tot / n)} a night`, small:`${fmt(d.cur, tot)} for ${n} ${n === 1 ? 'night' : 'nights'}${d.cur !== tb ? `${isFinite(cv(1)) ? `, about ${fmt(tb, cv(tot / n))} a night` : `. Add a ${esc(d.cur)} rate to see it in ${esc(tb)}`}` : ''}` }; }
  if(m === 'pax'){ const u = parseFloat(d.unit), q = parseInt(d.qty); if(!(u > 0)) return { empty:true, big:'Enter the price for one person and how many people' }; if(!(q > 0)) return { big:`${fmt(d.cur, u)} each`, small:'Add how many people to see the total' }; const sg = cv(u * q); return { big:`${fmt(d.cur, u * q)} in all`, small:`${q} ${q === 1 ? 'person' : 'people'} × ${fmt(d.cur, u)}${d.cur !== tb ? (isFinite(sg) ? `, about ${fmt(tb, sg)}` : `. Add a ${esc(d.cur)} rate to see it in ${esc(tb)}`) : ''}` }; }
  const tot = parseFloat(d.total); if(!(tot > 0)) return { empty:true, big:'Enter the amount' }; return { big:fmt(d.cur, tot), small:d.cur !== tb ? (isFinite(cv(tot)) ? `About ${fmt(tb, cv(tot))}` : `Add a ${esc(d.cur)} rate to see it in ${esc(tb)}`) : '' };
}

function dayRange(days){
  const n = days.map(i => i + 1); const parts = [];

}
// Where each day happens: the middle of its pinned stops, or its hotel if it has no stops.
function dayCentres(t){
  return t.days.map((d, i) => {
    let ps = d.places.filter(p => p.type === 'activity' && p.lat != null);
    if(!ps.length) ps = d.places.filter(p => p.type === 'hotel' && p.lat != null);
    return ps.length ? { i, lat:ps.reduce((a, p) => a + p.lat, 0) / ps.length, lon:ps.reduce((a, p) => a + p.lon, 0) / ps.length, pts:ps.map(p => [p.lat, p.lon]) } : null;

function fitZoom(pts, el){

function drawMarkers(){

  const on = id => focus === id || S.mapPopup === id ? 'focus' : '';

}

  if(e.key === 'Escape' && (S.dialog || S.picking || S.mapFull || S.fpFull)){ if(S.dialog || S.picking){ S.dialog = null; S.picking = null; S.addErr = null; } else { S.mapFull = false; if(S.fpFull){ S.fpFull = false; setTimeout(refitFoot, 0); } } render(); return; }
  if(e.key === 'Enter' && e.target.id === 'upass'){ e.preventDefault(); gateUnlock(); return; }
  if(e.key === 'Enter' && (e.target.id === 'lp1' || e.target.id === 'lp2')){ e.preventDefault(); gateSetup(); return; }
  if(e.key === 'Enter' && /^cp[012]$/.test(e.target.id)){ e.preventDefault(); doChangePass(); return; }
  if(e.key === 'Enter' && e.target.id === 'bp'){ e.preventDefault(); doBioOn(); return; }
  if(e.key === 'Enter' && e.target.id === 'aq'){ e.preventDefault(); const first = document.querySelector('#ares .results button'); if(first && !S.picked) first.click(); return; }
  const h = e.target.closest && e.target.closest('.handle[data-drag]');
  if(!h || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const t = T(); const what = h.dataset.what || 'p', day = +h.dataset.day, idx = +h.dataset.idx, key = what === 's' ? 'logistics' : 'places';
  const arr = t.days[day][key]; let toDay = day, toIdx;
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    const step = e.key === 'ArrowUp' ? -1 : 1; let j = idx + step;
    while(j >= 0 && j < arr.length && what === 'p' && arr[j].type !== 'activity') j += step;
    if(j < 0 || j >= arr.length) return;
    toIdx = step < 0 ? j : j + 1;
  } else {
    toDay = day + (e.key === 'ArrowLeft' ? -1 : 1); if(toDay < 0 || toDay >= t.days.length) return; toIdx = null;
  }
  const finalIdx = toDay === day ? (toIdx > idx ? toIdx - 1 : toIdx) : t.days[toDay][key].length;
  moveItem(what, day, idx, toDay, toIdx);
  document.querySelector(`.handle[data-drag="${h.dataset.drag}"][data-what="${what}"][data-day="${toDay}"][data-idx="${finalIdx}"]`)?.focus();
});

/* ===== drag and drop (touch and mouse) ===== */
let drag = null;
function moveItem(what, fromDay, fromIdx, toDay, toIdx){
  const t = T(); const key = what === 's' ? 'logistics' : 'places';
  const src = t.days[fromDay][key]; const [x] = src.splice(fromIdx, 1); const dst = t.days[toDay][key];
  let at = toIdx == null ? dst.length : toIdx; if(fromDay === toDay && fromIdx < at) at -= 1;
  dst.splice(Math.max(0, Math.min(at, dst.length)), 0, x);
  const name = what === 's' ? (x.desc || 'the step') : x.name;
  changed(); announce(fromDay === toDay ? `Moved ${name}` : `Moved ${name} to Day ${toDay + 1}`);
  render();
}
function clearMarks(){ document.querySelectorAll('.drop,.before,.after').forEach(n => n.classList.remove('drop', 'before', 'after')); }
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if(!h) return;
  const kind = h.dataset.drag; const srcEl = kind === 'ov' ? h.closest('.ovrow') : h.closest('.item');
  drag = { kind, what:h.dataset.what || 'p', day:+h.dataset.day, idx:+h.dataset.idx, x:e.clientX, y:e.clientY, started:false, srcEl, ghost:null, target:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.started){ if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.started = true;
    const r = drag.srcEl.getBoundingClientRect(); const g = drag.srcEl.cloneNode(true); g.classList.add('dragghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; drag.srcEl.classList.add('src'); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  const edge = 80; if(e.clientY < edge) window.scrollBy(0, -14); else if(e.clientY > innerHeight - edge) window.scrollBy(0, 14);
  clearMarks(); drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = ''; drag.target = null;
  if(!under) return;
  const sel = drag.kind === 'ov' ? '.ovrow[data-row]' : '.item[data-drag-item]';
  const rowEl = under.closest(sel); const dayEl = drag.kind === 'ov' ? under.closest('.ov-day') : null;
  if(rowEl && rowEl !== drag.srcEl){
    const [what, dd, ii] = (rowEl.dataset.row || rowEl.dataset.dragItem).split(':'); const r = rowEl.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
    rowEl.classList.add(before ? 'before' : 'after');
    drag.target = what === drag.what ? { day:+dd, idx:+ii + (before ? 0 : 1) } : { day:+dd, idx:null };
  } else if(dayEl){ dayEl.classList.add('drop'); drag.target = { day:+dayEl.dataset.day, idx:null }; }
}, { passive:false });
document.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.started) return;
  d.ghost.remove(); clearMarks(); d.srcEl.classList.remove('src');
  if(d.target && !(d.target.day === d.day && (d.target.idx === d.idx || d.target.idx === d.idx + 1 || d.target.idx === null))) moveItem(d.what, d.day, d.idx, d.target.day, d.target.idx);
});
document.addEventListener('pointercancel', () => { if(drag){ drag.ghost?.remove(); clearMarks(); drag.srcEl.classList.remove('src'); drag = null; } });

/* ===== start ===== */
// With the lock on, the lock screen comes first and the library is only opened by the passcode or passkey.
// Without it, the first open on a device offers to set it up ("Not now" is remembered on the device).
function startApp(){
  S.gate = null; S.addErr = null; S.dialog = null;
  const hit = findTodayTrip();
  if(hit){ library.activeTripId = hit.t.id; S.screen = 'itinerary'; S.day = hit.i; }
  else S.screen = 'home';
  window.scrollTo(0, 0); render(); saveNow();
  if(sync.token) setTimeout(syncNow, 600);
}
if(vaultOn()){ S.gate = 'unlock'; render(); }
else { loadLibrary(); if(dev.lock === 'skipped' || dev.lock === 'on') startApp(); else { S.gate = 'setup'; render(); } }
bioAvailable().then(v => { S.bioAvail = v; if(S.screen === 'settings' || S.gate) render(); });
window.addEventListener('pagehide', saveNow);

  if(document.visibilityState === 'hidden'){ saveNow(); if(sync.token && Object.values(sync.meta).some(m => m.dirty)) syncNow(); }
  else if(sync.token) syncNow();
});

window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { Object.values(MAPS).forEach(M => { if(M && M.el.isConnected) M.resize(); }); }, 150); });
setInterval(() => { if(document.visibilityState === 'visible' && !S.dialog && !document.activeElement.matches('input, textarea, select')) paintSync(); }, 60000);

setInterval(() => { if(sync.token && !S.gate && document.visibilityState === 'visible' && navigator.onLine && !syncing) syncNow(); }, SYNC_CHECK);
if('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
