/* ===== base (scaffolded) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

[hidden] { display: none !important; }

.num { font-variant-numeric: tabular-nums; }

/* ===== controls ===== */
.ic { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }

.input:disabled { opacity: 0.55; cursor: not-allowed; }

.seg button { min-height: 36px; padding: 0 var(--space-md); border: 1px solid transparent; border-radius: var(--radius-pill); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }

.chip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-edge); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink-2); font-size: var(--text-sm); cursor: pointer; transition: border-color var(--dur-short) var(--ease-out); }

/* ===== shell ===== */
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)); }

.bar-in { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--bar-h); }
.wordmark { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0; border: 0; background: none; font-family: var(--font-display); font-size: var(--text-lg); color: var(--color-ink); cursor: pointer; white-space: nowrap; }
.wordmark .ic { width: 22px; height: 22px; color: var(--color-accent); }
.tabs { display: flex; gap: var(--space-lg); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--bar-h); padding: 0; border: 0; background: none; color: var(--color-muted); font-size: var(--text-md); white-space: nowrap; cursor: pointer; transition: color var(--dur-short) var(--ease-out); }
.tab[aria-current="page"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-accent); }
.tab .today { font-size: var(--text-xs); padding: 0 var(--space-xs); border-radius: var(--radius-pill); background: var(--color-now); color: var(--color-accent-ink); }
.bar-right { display: flex; align-items: center; gap: var(--space-xs); }
.syncbtn { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-pill); background: none; color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; }
.syncbtn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.syncbtn[data-s="expiring"], .syncbtn[data-s="offline"] { color: var(--color-warn); }
.syncbtn[data-s="stopped"] { color: var(--color-error); }
@media (hover: hover) { .syncbtn:hover { background: var(--color-paper-2); } }
@media (max-width: 60rem) {
  :root { --gutter: 24px; --bar-h: 56px; }
  .bar-in { flex-wrap: wrap; row-gap: 0; }
  .tabs { order: 3; flex-basis: 100%; }

}
@media (max-width: 40rem) { :root { --gutter: 16px; } }
main { padding-block: var(--space-xl) var(--space-4xl); }
.screen { display: flex; flex-direction: column; gap: var(--space-2xl); min-width: 0; }
.screen > *, .bud-top > *, .it-grid > *, .summary > * { min-width: 0; }

.banner.bad { background: var(--color-error-wash); }
.foot { border-top: 1px solid var(--color-rule); }
.foot-in { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-lg); padding-block: var(--space-lg) var(--space-4xl); font-size: var(--text-sm); color: var(--color-muted); }
.foot-in p { margin-right: auto; }

/* ===== page heads ===== */
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-lg) var(--space-2xl); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--color-ink); }
.titleinput { width: min(100%, 24ch); padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; font-family: var(--font-display); font-weight: var(--display-weight); font-size: var(--text-display); letter-spacing: var(--tracking-display); line-height: 1.15; color: var(--color-ink); outline: 2px solid transparent; outline-offset: 4px; }
.titleinput:focus-visible { outline-color: var(--color-focus); }
@media (hover: hover) { .titleinput:hover { border-bottom-color: var(--color-rule); } }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-md) var(--space-xl); margin: 0; }
.meta div { display: flex; flex-direction: column; }

.sub { color: var(--color-muted); font-size: var(--text-md); }

.ruled { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-ink); }
.ruled > li { border-bottom: 1px solid var(--color-rule); }
.empty { padding-block: var(--space-lg); color: var(--color-muted); }

/* ===== home ===== */
.home-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--space-lg); }
@media (max-width: 40rem) { .home-head { grid-template-columns: minmax(0, 1fr); } }

/* ===== settings ===== */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2xl) var(--space-2xl); }
@media (max-width: 52rem) { .set-grid { grid-template-columns: minmax(0, 1fr); } }

/* ===== world map, centred on Singapore (1 unit = 1 degree, Singapore at x 180) ===== */
const W = (lon, lat) => [((lon - HOME.lon + 540) % 360), 90 - lat];
function cityStatus(name){ return TRIPS.some(t => new Date(t.end + 'T23:59:59') < today() && t.cities.includes(name)) ? 'past' : 'up'; }
function visitedCities(){ const s = new Set(); TRIPS.forEach(t => t.cities.forEach(c => s.add(c))); return [...s].filter(c => CITY_DB[c]); }
function worldMap(){
  const vb = [0, 14, 360, 124];
  const r = vb[2] * 0.0048;
  const H = W(HOME.lon, HOME.lat);
  let s = `<svg viewBox="${vb.join(' ')}" role="img" aria-label="World map centred on Singapore, marking the cities you have visited and the ones coming up"><path class="wm-land" d="${LAND}"/>`;
  TRIPS.forEach(t => {
    const c = CITY_DB[t.cities[0]]; if(!c) return; const Pp = W(c[1], c[0]);
    const mx = (H[0] + Pp[0]) / 2, my = (H[1] + Pp[1]) / 2, dx = Pp[0] - H[0], dy = Pp[1] - H[1], len = Math.hypot(dx, dy) || 1;
    let px = -dy / len, py = dx / len; if(py > 0){ px = -px; py = -py; }
    s += `<path class="wm-arc ${new Date(t.start) > today() ? 'up' : ''}" d="M${H[0]} ${H[1]} Q${(mx + px * len * .2).toFixed(2)} ${(my + py * len * .2).toFixed(2)} ${Pp[0]} ${Pp[1]}"/>`;
  });
  visitedCities().forEach(name => {
    const c = CITY_DB[name]; const [x, y] = W(c[1], c[0]); const rr = S.hlCity === name ? r * 1.7 : r;
    s += `<circle class="${cityStatus(name) === 'past' ? 'wm-dot' : 'wm-ring'}" data-act="hl" data-c="${esc(name)}" cx="${x}" cy="${y}" r="${rr}"><title>${esc(name)}${cityStatus(name) === 'past' ? '' : ', coming up'}</title></circle>`;
  });
  s += `<rect class="wm-home" x="${H[0] - r}" y="${H[1] - r}" width="${r * 2}" height="${r * 2}" transform="rotate(45 ${H[0]} ${H[1]})"><title>Singapore, home</title></rect></svg>`;
  const pos = (lon, lat) => { const [x, y] = W(lon, lat); return `left:${((x - vb[0]) / vb[2] * 100).toFixed(2)}%;top:${((y - vb[1]) / vb[3] * 100).toFixed(2)}%`; };
  let labs = '';
  visitedCities().forEach(name => {
    const c = CITY_DB[name]; const L = LABEL[name] || (NOLABEL.has(name) ? null : ['r']); const hl = S.hlCity === name;
    if(!L && !hl) return;
    labs += `<span class="wm-lab ${hl ? 'hl' : (L[0] === 'r' ? '' : L[0])}" style="${pos(c[1], c[0])}" aria-hidden="true">${esc(hl ? name : (L[1] || name))}</span>`;
  });
  labs += `<span class="wm-lab b home" style="${pos(HOME.lon, HOME.lat)}" aria-hidden="true">Singapore</span>`;
  return `<div class="world">${s}${labs}</div>`;
}

/* ===== trip map (Japan, cos-corrected equirectangular) ===== */
const KX = Math.cos(36 * Math.PI / 180);
const J = (lon, lat) => [(lon + 180) * KX, 90 - lat];
const unJ = (x, y) => ({ lon: x / KX - 180, lat: 90 - y });
function tripMap(opts){
  const { aspect = 4/3.3, filter = 'all', focus = null, picking = false, curDay = null } = opts;
  const nums = numbering(); const marks = []; const routes = [];
  if(filter === 'all' && !focus){
    const seenHotel = new Set(); const byCity = {};
    TRIP.days.forEach((d, i) => d.places.forEach(p => {
      if(p.lat == null || p.type === 'flight') return;
      const [x, y] = J(p.lon, p.lat);
      const key = d.city.split(' ')[0]; const o = byCity[key] = byCity[key] || { xs:[], ys:[] }; o.xs.push(x); o.ys.push(y);
      if(p.type === 'hotel'){ if(seenHotel.has(p.name)) return; seenHotel.add(p.name); }
      marks.push({ x, y, kind:p.type === 'hotel' ? 'hotel' : 'stop', txt:'', cat:p.category, id:p.id, label:`Day ${i + 1}, ${p.name}`, small:true });
    }));
    Object.entries(byCity).forEach(([city, o]) => marks.push({ x:o.xs.reduce((a, v) => a + v, 0) / o.xs.length, y:Math.min(...o.ys), kind:'citylab', label:city }));
  } else {
    const d = TRIP.days[filter]; const pts = [];
    d.places.forEach(p => {
      if(p.lat == null || p.type === 'flight') return;
      const [x, y] = J(p.lon, p.lat);
      marks.push({ x, y, kind:p.type === 'hotel' ? 'hotel' : 'stop', txt:p.type === 'hotel' ? 'H' : String(nums[p.id]), cur:true, cat:p.category, id:p.id, label:p.name });
      if(p.type === 'activity') pts.push([x, y]);
    });
    if(pts.length > 1) routes.push(...pts);
  }
  let pts = marks.filter(m => m.kind !== 'citylab').map(m => [m.x, m.y]); if(!pts.length) pts = [J(139.7, 35.68)];
  let cx, cy, w, h;
  if(focus){ const f = marks.find(m => m.id === focus) || marks[0]; cx = f.x; cy = f.y; w = 0.05; h = w / aspect; }
  else {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const minSpan = filter === 'all' ? 2.5 : 0.025;
    const pad = filter === 'all' ? 1.7 : 1.35; w = Math.max(x1 - x0, minSpan) * pad; h = Math.max(y1 - y0, minSpan / aspect) * pad; cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
    if(w / h < aspect) w = h * aspect; else h = w / aspect;
  }
  const vb = [cx - w / 2, cy - h / 2, w, h];
  const R = w * (filter === 'all' && !focus ? 0.026 : 0.03);
  let s = `<svg viewBox="${vb.map(v => v.toFixed(5)).join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of ${filter === 'all' ? 'the whole trip' : 'Day ' + (filter + 1)}" ${picking ? 'data-act="mapclick"' : ''}>`;
  s += `<rect class="tm-sea" x="${vb[0] - w}" y="${vb[1] - h}" width="${w * 3}" height="${h * 3}"/>`;
  s += `<g transform="scale(${KX} 1)"><path class="tm-land" d="${JAPAN}"/></g>`;
  if(routes.length > 1) s += `<polyline class="tm-route" points="${routes.map(q => q.join(',')).join(' ')}"/>`;
  marks.forEach(m => {
    if(m.kind === 'citylab'){ s += `<text class="tm-lab" x="${m.x}" y="${m.y - R * 1.4}" text-anchor="middle" font-size="${R * 1.35}" font-weight="600" stroke-width="${R * .5}">${esc(m.label)}</text>`; return; }
    const rr = m.small ? R * 0.7 : R;
    const attrs = m.kind === 'city' ? `data-act="mapday" data-i="${m.day}"` : `data-act="pin" data-id="${m.id}"`;
    s += `<g class="pin" ${attrs}>`;
    if(focus && m.id === focus) s += `<circle class="tm-pulse" cx="${m.x}" cy="${m.y}" r="${R * 1.4}"/>`;
    if(m.kind === 'hotel') s += `<rect class="tm-pin hotel" x="${m.x - rr}" y="${m.y - rr}" width="${rr * 2}" height="${rr * 2}"/>`;
    else s += `<circle class="tm-pin ${m.kind === 'stop' ? 'c-' + m.cat : m.cur ? 'cur' : ''}" cx="${m.x}" cy="${m.y}" r="${rr}"/>`;
    s += `<text class="tm-num" x="${m.x}" y="${m.y}" text-anchor="middle" dominant-baseline="central" font-size="${R * 1.05}">${m.txt}</text>`;
    if(m.kind === 'city') s += `<text class="tm-lab" x="${m.x > cx ? m.x - R * 1.6 : m.x + R * 1.6}" text-anchor="${m.x > cx ? 'end' : 'start'}" y="${m.y}" dominant-baseline="central" font-size="${R * 1.15}" stroke-width="${R * .4}">${esc(m.label)}</text>`;
    s += `<title>${esc(m.label)}</title></g>`;
  });
  s += `</svg>`;
  return `<div class="tripmap ${picking ? 'picking' : ''}" style="aspect-ratio:${aspect}">${s}</div>`;
}

/* ===== Google Maps link parsing ===== */
const EX = {
  short: 'https://maps.app.goo.gl/JJPYF9HCxvhZecEz7?g_st=ic',
  long: 'https://www.google.com/maps/place/Ichiran+Shibuya/@35.6612,139.7016,17z/data=!3m1!4b1!4m6!3m5!1s0x60188ca8b7c0a2a9:0x1!8m2!3d35.6611!4d139.7017',
};
function parseMaps(text){
  const t = (text || '').trim(); if(!t) return { kind:'empty' };
  const num = '(-?\\d{1,3}\\.\\d+)';
  const m = t.match(new RegExp('!3d' + num + '!4d' + num)) || t.match(new RegExp('@' + num + ',' + num)) || t.match(new RegExp('[?&](?:q|query|ll|destination|center)=' + num + ',\\s*' + num));
  const nm = t.match(/\/maps\/place\/([^/@?]+)/);
  const name = nm ? decodeURIComponent(nm[1].replace(/\+/g, ' ')) : 'Pinned place';
  if(m) return { kind:'coords', lat:+m[1], lon:+m[2], name, via:'link' };
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(t)) return S.helperSet ? { kind:'coords', lat:35.6611, lon:139.7017, name:'Ichiran Shibuya', via:'helper' } : { kind:'nohelper' };
  return { kind:'unknown' };
}
function linkResHTML(){
  const r = parseMaps(S.link);
  if(r.kind === 'empty') return `<p class="sub">In Google Maps, tap Share, then Copy link, and paste it here. Short and full links both work.</p>`;
  if(r.kind === 'coords') return `<div class="result ok">${I('check')}<div><b>${esc(r.name)}</b><span class="num">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</span><br><span>${r.via === 'helper' ? 'Your short-link reader opened the link. In the mockup every short link gives this sample place.' : 'The location was read straight from the link.'}</span></div></div>`;
  if(r.kind === 'nohelper') return `<div class="result warn">${I('alert')}<div><b>Short links need the short-link reader</b><span>Set up the short-link reader once in Settings, or search by name for now.</span></div></div>`;
  return `<div class="result warn">${I('alert')}<div><b>This isn't a Google Maps link</b><span>Copy the link from the Share button in Google Maps and paste it here.</span></div></div>`;
}

function untilText(t, now){ const m = (+t.slice(0, 2) * 60 + +t.slice(3)) - (+now.slice(0, 2) * 60 + +now.slice(3)); if(m <= 0) return 'now'; const h = Math.floor(m / 60), mm = m % 60; return 'in ' + (h ? h + ' h' + (mm ? ' ' + mm + ' min' : '') : mm + ' min'); }

  if(k === 'token') return box('GitHub access token', `<p>Paste a fine-grained token that can only read and write Trip-Tracker-data. It stays on this device.</p><div class="field"><label for="tok">Token</label><input id="tok" class="input num" placeholder="github_pat_" autocomplete="off"></div><div><button type="button" class="btn btn--primary" data-act="savetoken">Save and sync</button></div>`);
  if(k === 'key') return box('Google Maps key', `<div class="field"><label for="gk">Key</label><input id="gk" class="input num" placeholder="AIza" autocomplete="off"></div><p class="sub">Saved to your private data repo and synced to your devices.</p><div><button type="button" class="btn btn--primary" data-act="close">Save the key</button></div>`);

function pastCheckHTML(cs){

function fitMap(){

window.addEventListener('resize', () => { clearTimeout(fitMap.t); fitMap.t = setTimeout(fitMap, 120); });

/* ===== actions ===== */
function addPlace(){
  const t = S.addType; const di = S.addDay != null ? S.addDay : S.day;
  if(t === 'do' || t === 'move'){
    if(!S.sWhat.trim()){ S.addErr = t === 'do' ? 'Say what the activity is first.' : 'Add the route or details first.'; render(); return; }
    TRIP.days[di].times.push({ t:S.sTime, d:S.sWhat.trim(), kind: t === 'do' ? 'activity' : 'transport' });
    announce(`Added ${S.sWhat.trim()} to Day ${di + 1}`); S.sTime = ''; S.sWhat = '';
  } else if(t === 'flight'){
    if(!S.fName.trim()){ S.addErr = 'Enter the flight name or number first.'; render(); return; }
    TRIP.days[di].places.unshift(P({ type:'flight', name:S.fName.trim(), dep:S.fDep || 'not set', arr:S.fArr || 'not set', note:S.addNote }));
    announce(`Added ${S.fName.trim()} to Day ${di + 1}`); S.fName = S.fDep = S.fArr = '';
  } else {
    let found = null;
    if(S.addMode === 'search'){ found = SEARCH.find(s => s.name === S.picked); if(!found){ S.addErr = 'Pick a result from the list so the place lands on the map.'; render(); return; } }
    else { const r = parseMaps(S.link); if(r.kind !== 'coords'){ S.addErr = 'Paste a Google Maps link that shows a location first.'; render(); return; } found = { name:r.name, addr:'Added from a Google Maps link', lat:r.lat, lon:r.lon }; }
    if(t === 'hotel'){
      const a = S.hFrom ?? di, b = S.hTo ?? di; const lo = Math.min(a, b), hi = Math.max(a, b);
      for(let j = lo; j <= hi; j++) TRIP.days[j].places.splice(TRIP.days[j].places.filter(p => p.type === 'flight').length, 0, P({ type:'hotel', name:found.name, addr:found.addr, lat:found.lat, lon:found.lon, note:S.addNote }));
      announce(`Added ${found.name} to ${dayList(Array.from({ length:hi - lo + 1 }, (_, k) => lo + k + 1))}`);
    } else {
      TRIP.days[di].places.push(act(S.addCat, found.name, found.addr, found.lat, found.lon, S.addNote));
      announce(`Added ${found.name} to Day ${di + 1}`);
    }
    S.q = ''; S.picked = null; S.link = '';
  }
  S.addErr = null; S.addNote = ''; S.wiki = null; S.dialog = null; S.day = di; render();
}
function saveExpense(){
  const d = S.draft; const m = catOf(d.cat).mode;
  const e = S.editing ? EXPENSES.find(x => x.id === S.editing) : { id:uid() };
  const o = { cat:d.cat, desc:d.desc || d.cat, date:d.date, cur:d.cur };
  if(m === 'pax'){ if(!(parseFloat(d.unit) > 0)){ S.expErr = { f:'funit', msg:'Enter the price for one person, then add the expense.' }; render(); document.getElementById('funit')?.focus(); return; } if(!(parseInt(d.qty) > 0)){ S.expErr = { f:'fqty', msg:'Enter how many people, then add the expense.' }; render(); document.getElementById('fqty')?.focus(); return; } Object.assign(o, { unit:parseFloat(d.unit), qty:parseInt(d.qty), total:undefined, nights:undefined }); }
  else { if(!(parseFloat(d.total) > 0)){ S.expErr = { f:'ftotal', msg:m === 'nights' ? 'Enter the total for the stay, then add the expense.' : 'Enter the amount, then add the expense.' }; render(); document.getElementById('ftotal')?.focus(); return; } Object.assign(o, { total:parseFloat(d.total), nights:m === 'nights' ? (parseInt(d.nights) || null) : undefined, unit:undefined, qty:undefined }); }
  S.expErr = null; Object.assign(e, o); if(!S.editing) EXPENSES.unshift(e);
  announce(`${S.editing ? 'Saved' : 'Added'} ${e.desc}, ${fmt(e.cur, expTotal(e))}`);
  S.editing = null; S.draft = { cat:d.cat, desc:'', date:d.date, cur:TRIP.localCur, total:'', nights:'', unit:'', qty:'' }; render();
}
function confirmBox(title, body, yes, fn){ S.confirm = { title, body, yes, fn }; S.dialog = 'confirm'; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act; if(a === 'closebg' && e.target !== el) return;
  switch(a){
    case 'pretend': S.pretend = el.dataset.v; if(S.pretend === 'during'){ S.screen = 'itinerary'; S.day = tripDayIndex(); S.mapMode = 'day'; } else { S.screen = 'home'; S.day = 0; } S.mapFocus = S.mapPopup = null; S.dialog = null; window.scrollTo(0, 0); toast(S.pretend === 'during' ? 'During a trip the app opens on today’s plan.' : 'Before a trip the app opens on your world map.'); break;
    case 'gotoday': S.screen = 'itinerary'; S.day = tripDayIndex(); S.mapMode = 'day'; window.scrollTo(0, 0); break;
    case 'nav': S.screen = el.dataset.to; S.dialog = null; S.picking = null; window.scrollTo(0, 0); break;
    case 'sync': S.sync = { synced:'saving', saving:'offline', offline:'expiring', expiring:'stopped', stopped:'synced' }[S.sync]; break;
    case 'syncnow': S.sync = 'synced'; announce('Synced with GitHub'); break;
    case 'savetoken': S.sync = 'synced'; S.dialog = null; announce('Token saved on this device, sync running'); break;
    case 'helper': S.helperSet = !S.helperSet; break;
    case 'theme': S.theme = el.dataset.v; break;
    case 'accent': S.accent = el.dataset.v; if(!isDark()) S.theme = 'dark'; break;
    case 'showkey': S.showKey = !S.showKey; break;
    case 'sz': S.scale = Math.max(.8, Math.min(1.5, +(S.scale + .1 * el.dataset.d).toFixed(1))); break;
    case 'toast': toast(el.dataset.m); return;
    case 'dialog': S.dialog = el.dataset.d; S.addErr = null; if(el.dataset.t) S.addType = el.dataset.t; break;
    case 'close': case 'closebg': S.dialog = null; break;
    case 'confirmyes': { const fn = S.confirm.fn; S.dialog = null; fn(); } break;
    case 'hl': S.hlCity = S.hlCity === el.dataset.c ? null : el.dataset.c; break;
    case 'opentrip': if(el.dataset.id === 'jp'){ S.screen = 'overview'; window.scrollTo(0, 0); } else { toast('Opens that trip in the real app. Only Japan is filled in for the mockup.'); return; } break;
    case 'savepast': {
      const f = S.pastForm; const cs = f.cities.split(',').map(s => s.trim()).filter(Boolean).map(c => Object.keys(CITY_DB).find(k => k.toLowerCase() === c.toLowerCase())).filter(Boolean);
      if(!f.name || !f.from || !cs.length){ toast('Add a name, a first day and at least one city.'); return; }
      TRIPS.push({ id:uid(), name:f.name, start:f.from, end:f.to || f.from, cities:cs, kind:'maponly' }); TRIPS.sort((x, y) => y.start.localeCompare(x.start));
      S.pastForm = { name:'', from:'', to:'', cities:'' }; S.dialog = null; S.screen = 'home'; announce(`Added ${f.name}. ${cs.join(' and ')} now on your map`); window.scrollTo(0, 0);
    } break;
    case 'askdeltrip': { if(el.dataset.id === 'jp'){ toast('The mockup keeps the Japan trip so the other screens still work.'); return; } const t = TRIPS.find(x => x.id === el.dataset.id); confirmBox('Delete this trip?', `${esc(t.name)} will be removed from every device. Older versions stay in your GitHub history.`, 'Delete the trip', () => { TRIPS.splice(TRIPS.indexOf(t), 1); announce('Trip deleted'); render(); }); } return;
    case 'askclear': confirmBox('Clear this trip?', 'Every day, place and expense in Japan in Autumn will be removed.', 'Clear the trip', () => toast('Mockup: nothing was cleared.')); return;
    case 'note': case 'daynotes': S.openNotes.has(el.dataset.id) ? S.openNotes.delete(el.dataset.id) : S.openNotes.add(el.dataset.id); break;
    case 'edititem': S.editItem = el.dataset.id; break;
    case 'doneitem': S.editItem = null; break;
    case 'editday': S.editDay = !S.editDay; break;
    case 'doneday': S.editDay = false; break;
    case 'stepkind': TRIP.days[S.day].times[+el.dataset.k].kind = el.dataset.v; break;
    case 'mapm': S.mapMode = el.dataset.m; S.mapFocus = null; S.mapPopup = null; break;
    case 'closepop': S.mapPopup = null; S.mapFocus = null; break;
    case 'mapday': S.screen = 'itinerary'; S.day = +el.dataset.i; S.mapMode = 'day'; S.mapFocus = null; S.mapPopup = null; break;
    case 'pin': S.mapPopup = el.dataset.id; break;
    case 'unfocus': S.mapFocus = null; break;
    case 'pick': { S.picking = el.dataset.id; const f = findPlace(el.dataset.id); S.screen = 'itinerary'; S.day = TRIP.days.indexOf(f.d); S.mapMode = 'day'; S.mapFocus = null; S.mapPopup = null; } break;
    case 'pickcancel': S.picking = null; break;
    case 'mapclick': {
      if(!S.picking) return; const svg = el.closest('svg'); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse()); const ll = unJ(loc.x, loc.y); const f2 = findPlace(S.picking);
      f2.p.lat = +ll.lat.toFixed(5); f2.p.lon = +ll.lon.toFixed(5); S.picking = null; S.mapPopup = f2.p.id; announce(`Pinned ${f2.p.name}`);
    } break;
    case 'day': S.editTime = null; S.editItem = null; S.editDay = false; S.scrollDay = true; if(S.screen !== 'itinerary'){ S.screen = 'itinerary'; window.scrollTo(0, 0); } S.day = +el.dataset.i; S.addDay = null; S.hFrom = S.hTo = null; S.mapFocus = null; S.mapPopup = null; S.picking = null; break;
    case 'addday': { const last = TRIP.days[TRIP.days.length - 1]; TRIP.days.push(D(addDaysISO(last.date, 1), '', '', [], [])); S.day = TRIP.days.length - 1; announce(`Added Day ${TRIP.days.length}, ${dLong(TRIP.days[S.day].date)}`); } break;
    case 'moveday': {
      const i = +el.dataset.i, j = i + +el.dataset.d; if(j < 0 || j >= TRIP.days.length) return;
      const dates = TRIP.days.map(d => d.date);
      [TRIP.days[i], TRIP.days[j]] = [TRIP.days[j], TRIP.days[i]];
      TRIP.days.forEach((d, k) => d.date = dates[k]);
      if(S.screen === 'itinerary') S.day = j;
      announce(`Moved ${TRIP.days[j].city || 'the day'} to Day ${j + 1}. Dates stay in order`);
    } break;
    case 'askdelday': { const i = S.day; confirmBox(`Delete Day ${i + 1}?`, 'Everything planned for this day, including its hotel night, flights and notes, will be removed.', 'Delete the day', () => { TRIP.days.splice(i, 1); S.day = Math.max(0, i - 1); announce(`Deleted Day ${i + 1}`); render(); }); } return;
    case 'delplace': { const f = findPlace(el.dataset.id); f.d.places.splice(f.i, 1); undoToast(`Removed ${f.p.name}`, () => f.d.places.splice(f.i, 0, f.p)); } break;
    case 'undo': { const fn = S.undo; S.undo = null; document.querySelector('.toast')?.remove(); if(fn){ fn(); announce('Restored'); } } break;
    case 'edittime': S.editTime = +el.dataset.k; break;
    case 'donetime': S.editTime = null; TRIP.days[S.day].times.sort((a, b) => (a.t || '99').localeCompare(b.t || '99')); break;
    case 'addtime': TRIP.days[S.day].times.push({ t:'', d:'' }); S.editTime = TRIP.days[S.day].times.length - 1; break;
    case 'deltime': { const dd = TRIP.days[S.day]; const k = +el.dataset.k; const [x] = dd.times.splice(k, 1); S.editTime = null; undoToast(`Removed ${x.d || 'the step'}`, () => dd.times.splice(k, 0, x)); } break;
    case 'atype': S.addType = el.dataset.t; S.wiki = null; break;
    case 'acat': S.addCat = el.dataset.c; break;
    case 'amode': S.addMode = el.dataset.m; break;
    case 'ex': S.link = EX[el.dataset.k]; break;
    case 'pickres': S.picked = el.dataset.n; S.q = el.dataset.n; break;
    case 'wiki': { const name = S.addMode === 'search' ? (S.picked || S.q) : parseMaps(S.link).name; const hit = Object.keys(WIKI).find(k => (name || '').toLowerCase().includes(k.toLowerCase())); S.wiki = hit ? WIKI[hit] : `No Wikipedia summary found${name ? ' for “' + name + '”' : ''}. In the mockup, try Senso-ji or Meiji Jingu.`; if(hit) S.addNote = S.addNote || WIKI[hit]; } break;
    case 'addplace': addPlace(); return;
    case 'cat': S.draft.cat = el.dataset.c; break;
    case 'saveexp': saveExpense(); return;
    case 'editexp': { const x = EXPENSES.find(y => y.id === el.dataset.id); S.editing = x.id; S.draft = { cat:x.cat, desc:x.desc, date:x.date, cur:x.cur, total:x.total ?? '', nights:x.nights ?? '', unit:x.unit ?? '', qty:x.qty ?? '1' }; render(); document.querySelector('[data-form="exp"]')?.scrollIntoView({ block:'center' }); } return;
    case 'canceledit': S.editing = null; S.draft = { ...S.draft, desc:'', total:'', nights:'', unit:'' }; break;
    case 'delexp': { const i = EXPENSES.findIndex(y => y.id === el.dataset.id); const x = EXPENSES[i]; EXPENSES.splice(i, 1); if(S.editing === x.id) S.editing = null; undoToast(`Removed ${x.desc}`, () => EXPENSES.splice(i, 0, x)); } break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const t = e.target; const d = TRIP.days[S.day];
  if(t.dataset.f){ S.draft[t.dataset.f] = t.value; if(S.expErr && t.id === S.expErr.f){ S.expErr = null; t.removeAttribute('aria-invalid'); document.getElementById('experr')?.remove(); } const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  if(t.dataset.pf){ S.pastForm[t.dataset.pf] = t.value; if(t.dataset.pf === 'cities') document.getElementById('pcheck').innerHTML = pastCheckHTML(t.value.split(',').map(s => s.trim()).filter(Boolean)); return; }
  switch(t.dataset.in){
    case 'tripname': TRIP.name = t.value; break;
    case 'dcity': d.city = t.value; break;
    case 'dnotes': d.notes = t.value; break;
    case 'ttime': d.times[+t.dataset.k].t = t.value; break;
    case 'tdesc': d.times[+t.dataset.k].d = t.value; break;
    case 'pnote': findPlace(t.dataset.id).p.note = t.value; break;
    case 'ptime': findPlace(t.dataset.id).p.time = t.value; break;
    case 'aq': S.q = t.value; S.picked = null; document.getElementById('ares').innerHTML = searchResHTML(); break;
    case 'alink': S.link = t.value; document.getElementById('alinkres').innerHTML = linkResHTML(); break;
    case 'fname': S.fName = t.value; break;
    case 'swhat': S.sWhat = t.value; break;
    case 'anote': S.addNote = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.f === 'cur'){ S.draft.cur = t.value; const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  switch(t.dataset.in){
    case 'ddate': TRIP.days[S.day].date = t.value; render(); break;
    case 'fdep': S.fDep = t.value; break;
    case 'stime': S.sTime = t.value; break;
    case 'farr': S.fArr = t.value; break;
    case 'aday': S.addDay = +t.value; break;
    case 'hfrom': S.hFrom = +t.value; break;
    case 'hto': S.hTo = +t.value; break;
    case 'lcur': TRIP.localCur = t.value; S.draft.cur = t.value; render(); break;
    case 'bcur': changeBase(t.value); render(); break;
    case 'accent': S.accent = t.value; if(!isDark()) S.theme = 'dark'; render(); break;
    default: if(t.dataset.rate){ const v = parseFloat(t.value); if(v > 0) TRIP.rates[t.dataset.rate] = v; else delete TRIP.rates[t.dataset.rate]; render(); } break;
    case 'findplace': S.mapFocus = t.value || null; S.mapPopup = t.value || null; render(); break;
    case 'movestep': { const from = TRIP.days[S.day]; const [x] = from.times.splice(+t.dataset.k, 1); TRIP.days[+t.value].times.push(x); S.editTime = null; announce(`Moved ${x.d} to Day ${+t.value + 1}`); render(); } break;
    case 'moveto': { const f = findPlace(t.dataset.id); const to = +t.value; f.d.places.splice(f.i, 1); TRIP.days[to].places.push(f.p); announce(`Moved ${f.p.name} to Day ${to + 1}`); render(); } break;
  }
});
document.addEventListener('toggle', e => { if(e.target.dataset && e.target.dataset.tg === 'details') S.openDetails = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && (S.dialog || S.picking)){ S.dialog = null; S.picking = null; render(); return; }
  const h = e.target.closest && e.target.closest('.handle[data-drag]');
  if(!h || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const what = h.dataset.what || 'p', day = +h.dataset.day, idx = +h.dataset.idx, key = what === 's' ? 'times' : 'places';
  const arr = TRIP.days[day][key]; let toDay = day, toIdx;
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    const step = e.key === 'ArrowUp' ? -1 : 1; let j = idx + step;
    while(j >= 0 && j < arr.length && what === 'p' && arr[j].type !== 'activity') j += step;
    if(j < 0 || j >= arr.length) return;
    toIdx = step < 0 ? j : j + 1;
  } else {
    toDay = day + (e.key === 'ArrowLeft' ? -1 : 1); if(toDay < 0 || toDay >= TRIP.days.length) return; toIdx = null;
  }
  const finalIdx = toDay === day ? (toIdx > idx ? toIdx - 1 : toIdx) : TRIP.days[toDay][key].length;
  moveItem(what, day, idx, toDay, toIdx);
  const sel = `.handle[data-drag="${h.dataset.drag}"][data-what="${what}"][data-day="${toDay}"][data-idx="${finalIdx}"]`;
  document.querySelector(sel)?.focus();
});

/* ===== drag and drop (touch and mouse) ===== */
let drag = null;
function moveItem(what, fromDay, fromIdx, toDay, toIdx){
  const key = what === 's' ? 'times' : 'places';
  const src = TRIP.days[fromDay][key]; const [x] = src.splice(fromIdx, 1); const dst = TRIP.days[toDay][key];
  let at = toIdx == null ? dst.length : toIdx; if(fromDay === toDay && fromIdx < at) at -= 1;
  dst.splice(Math.max(0, Math.min(at, dst.length)), 0, x);
  const name = what === 's' ? x.d : x.name;
  announce(fromDay === toDay ? `Moved ${name}` : `Moved ${name} to Day ${toDay + 1}`);
  render();
}
function clearMarks(){ document.querySelectorAll('.drop,.before,.after').forEach(n => n.classList.remove('drop', 'before', 'after')); }
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if(!h) return;
  const kind = h.dataset.drag; const srcEl = kind === 'ov' ? h.closest('.ovrow') : h.closest('.item');
  drag = { kind, what:h.dataset.what || 'p', day:+h.dataset.day, idx:+h.dataset.idx, x:e.clientX, y:e.clientY, started:false, srcEl, ghost:null, target:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.started){ if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.started = true;
    const r = drag.srcEl.getBoundingClientRect(); const g = drag.srcEl.cloneNode(true); g.classList.add('dragghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; drag.srcEl.classList.add('src'); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  const edge = 80; if(e.clientY < edge) window.scrollBy(0, -14); else if(e.clientY > innerHeight - edge) window.scrollBy(0, 14);
  clearMarks(); drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = ''; drag.target = null;
  if(!under) return;
  const sel = drag.kind === 'ov' ? '.ovrow[data-row]' : '.item[data-drag-item]';
  const rowEl = under.closest(sel); const dayEl = drag.kind === 'ov' ? under.closest('.ov-day') : null;
  if(rowEl && rowEl !== drag.srcEl){
    const [what, dd, ii] = (rowEl.dataset.row || rowEl.dataset.dragItem).split(':'); const r = rowEl.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
    rowEl.classList.add(before ? 'before' : 'after');
    drag.target = what === drag.what ? { day:+dd, idx:+ii + (before ? 0 : 1) } : { day:+dd, idx:null };
  } else if(dayEl){ dayEl.classList.add('drop'); drag.target = { day:+dayEl.dataset.day, idx:null }; }
}, { passive:false });
document.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.started) return;
  d.ghost.remove(); clearMarks(); d.srcEl.classList.remove('src');
  if(d.target && !(d.target.day === d.day && (d.target.idx === d.idx || d.target.idx === d.idx + 1 || d.target.idx === null))) moveItem(d.what, d.day, d.idx, d.target.day, d.target.idx);
});
document.addEventListener('pointercancel', () => { if(drag){ drag.ghost?.remove(); clearMarks(); drag.srcEl.classList.remove('src'); drag = null; } });

render();
</script>
